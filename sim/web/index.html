<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CppDnD</title>
<style>
:root { --bg:#14121a; --panel:#1d1a26; --edge:#322d42; --text:#e6e1ee; --dim:#9a93ab; --accent:#c9a24d; --party:#4a8fe0; --foe:#d65a5a; --ok:#5fb37a; --bad:#d65a5a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--edge); }
header h1 { font-size:18px; margin:0; color:var(--accent); letter-spacing:.05em; }
header .sp { flex:1; }
main { display:grid; gap:12px; padding:12px 16px; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); }
@media (max-width:900px){ main { grid-template-columns:1fr; } }
.panel { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:12px; }
.panel h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600; }
button, select, input { font:inherit; color:var(--text); background:#2a2638; border:1px solid var(--edge); border-radius:6px; padding:6px 10px; }
button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--accent); } button:disabled { opacity:.45; cursor:not-allowed; }
button.primary { background:var(--accent); color:#1a1405; border-color:var(--accent); font-weight:600; }
button.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.dim { color:var(--dim); } .small { font-size:13px; }
#log { height:46vh; overflow:auto; font-size:13.5px; }
#log div { padding:1px 0; white-space:pre-wrap; }
#log .scene { color:var(--accent); margin-top:8px; font-weight:600; } #log .narration { color:#cdbfe6; font-style:italic; }
#log .quest, #log .rest, #log .travel { color:var(--ok); } #log .round_start { color:var(--dim); margin-top:6px; } #log .turn_start { color:#b9c7ff; }
#log .death, #log .down { color:var(--bad); } #log .flavour { color:var(--dim); font-style:italic; padding-left:12px; }
.bar { height:6px; background:#0e0c14; border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--ok); }
.member { padding:6px 0; border-top:1px solid var(--edge); } .member:first-of-type { border-top:0; }
.member.dead { opacity:.45; text-decoration:line-through; }
#grid { display:grid; gap:1px; background:#0c0a12; width:max-content; max-width:100%; overflow:auto; border:1px solid var(--edge); }
.cell { width:26px; height:26px; display:flex; align-items:center; justify-content:center; font:700 13px ui-monospace, monospace; background:#262235; user-select:none; }
.cell.wall { background:#08070c; } .cell.rough { background:#322c3f; } .cell.half, .cell.three { background:#3a3326; }
.cell.party { background:var(--party); color:#06121f; border-radius:50%; } .cell.foe { background:var(--foe); color:#240808; border-radius:50%; }
.cell.down { opacity:.5; } .cell.cur { outline:2px solid var(--accent); } .cell.target { cursor:crosshair; } .cell.move { cursor:pointer; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#3b1d24; border:1px solid var(--bad); padding:8px 14px; border-radius:6px; display:none; max-width:90vw; }
.start { max-width:560px; margin:30px auto; } .start label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
.start select, .start input { width:100%; }
</style>
</head>
<body>
<header><h1>CppDnD</h1><span id="sub" class="dim small"></span><span class="sp"></span>
  <button id="saveBtn" hidden>Save</button><button id="newBtn" hidden>New game</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
let gid = null, view = null, lastSeq = 0, content = null, pending = { kind: "attack", index: 0 }, busy = false;

async function api(method, path, body) {
  try {
    const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({ error: "bad response" }));
    return { status: r.status, data };
  } catch (e) { return { status: 0, data: { error: "cannot reach the server" } }; }
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500); }

// ---------------------------------------------------------------- start screen
async function showStart() {
  gid = null; view = null; lastSeq = 0;
  $("#saveBtn").hidden = $("#newBtn").hidden = true; $("#sub").textContent = "";
  if (!content) content = (await api("GET", "/api/content")).data;
  const mods = el("select", { id: "mod" }, el("option", { value: "", textContent: "Procedural delve (3 rooms)" }));
  for (const m of content.modules || []) mods.append(el("option", { value: m.id, textContent: `${m.name} (level ${m.recommendedLevel})` }));
  mods.value = (content.modules || [])[0]?.id || "";
  const role = el("select", { id: "role" }, ...[["player", "Player (one hero)"], ["dm", "Dungeon Master (all monsters)"], ["spectator", "Spectator (AI plays)"]].map(([v, t]) => el("option", { value: v, textContent: t })));
  const hero = el("select", { id: "hero" }, ...(content.characters || []).filter(c => ["thorin", "elara", "aldric", "finn"].includes(c.id)).map(c => el("option", { value: c.id, textContent: `${c.name} (${c.class})` })));
  const seed = el("input", { id: "seed", type: "number", placeholder: "random" });
  const file = el("input", { type: "file", accept: ".json" });
  const go = el("button", { className: "primary", textContent: "Begin", onclick: async () => {
    const body = { module: mods.value, role: role.value, hero: hero.value };
    if (seed.value) body.seed = Number(seed.value);
    const { status, data } = await api("POST", "/api/games", body);
    if (status !== 201) return toast(data.error || "could not start");
    startGame(data.id, data.view);
  } });
  file.onchange = async () => {
    const text = await file.files[0].text(); let save; try { save = JSON.parse(text); } catch { return toast("not a valid save file"); }
    const { status, data } = await api("POST", "/api/games/load", save);
    if (status !== 201) return toast(data.error || "could not load");
    startGame(data.id, data.view);
  };
  $("#app").replaceChildren(el("div", { className: "panel start" }, el("h2", { textContent: "New game" }),
    el("label", { textContent: "Module" }), mods, el("label", { textContent: "Role" }), role, el("label", { textContent: "Hero" }), hero,
    el("label", { textContent: "Seed (optional, reproducible)" }), seed, el("div", { className: "row" }, go),
    el("label", { textContent: "Or load a save file" }), file));
}

function startGame(id, v) {
  gid = id; lastSeq = 0;
  $("#app").replaceChildren(el("main", {},
    el("div", {}, el("div", { className: "panel", id: "scene" }), el("div", { className: "panel", id: "combat", hidden: true }), el("div", { className: "panel", id: "log" })),
    el("div", {}, el("div", { className: "panel", id: "party" }), el("div", { className: "panel", id: "quests", style: "margin-top:12px" }))));
  $("#saveBtn").hidden = $("#newBtn").hidden = false;
  apply(v);
}

// ---------------------------------------------------------------- state
function logEvents(events) {
  const log = $("#log"); if (!log) return;
  for (const e of events) {
    if (e.seq <= lastSeq) continue; lastSeq = e.seq;
    const d = el("div", { className: e.type, textContent: e.text }); log.append(d);
    if (e.flavour) log.append(el("div", { className: "flavour", textContent: e.flavour }));
  }
  log.scrollTop = log.scrollHeight;
}
function apply(v) {
  view = v; logEvents(v.events || []);
  $("#sub").textContent = `${v.module.name}  |  day ${v.clock.day}, ${String(v.clock.clockHour).padStart(2, "0")}:00${v.clock.night ? " (night)" : ""}  |  ${v.mode}`;
  renderScene(); renderParty(); renderQuests(); renderCombat();
  if (v.mode === "combat" && v.combat && !v.combat.finished && v.combat.awaiting < 0 && !busy) setTimeout(advance, 120);
}
async function advance() {
  if (busy || !gid) return; busy = true;
  const { status, data } = await api("POST", `/api/games/${gid}/advance?since=${lastSeq}`); busy = false;
  if (status !== 200) return toast(data.error || "advance failed");
  apply(data.view);
}
async function cmd(path, body = {}) {
  if (busy || !gid) return; busy = true;
  const { data } = await api("POST", `/api/games/${gid}/${path}?since=${lastSeq}`, body); busy = false;
  if (data.ok === false && data.message) toast(data.message);
  if (data.ok === false && data.reason) toast(data.reason);
  if (data.view) apply(data.view); else if (data.error) toast(data.error);
}

// ---------------------------------------------------------------- exploration
function renderScene() {
  const box = $("#scene"), v = view, l = v.location;
  if (v.mode === "complete" || v.mode === "defeated") {
    box.replaceChildren(el("h2", { textContent: v.mode === "complete" ? "The tale is told" : "The party has fallen" }),
      el("div", { className: "row" }, el("button", { className: "primary", textContent: "New game", onclick: showStart })));
    return;
  }
  const exploring = v.mode === "exploring";
  const rows = [el("h2", { textContent: l.name }), el("div", { textContent: l.description }),
    el("div", { className: "dim small", textContent: `Resting here: ${l.rest}` })];
  const exits = el("div", { className: "row" });
  for (const x of l.exits) {
    const hrs = x.hours || (x.miles ? `${x.miles} mi` : "");
    exits.append(el("button", { textContent: `Go: ${x.name}${hrs ? ` (${hrs}${x.hours ? "h" : ""})` : ""}`, disabled: !exploring || !x.available, title: x.blocked || x.label,
      onclick: () => cmd("travel", { to: x.to }) }));
  }
  rows.push(el("h2", { textContent: "Paths", style: "margin-top:12px" }), exits);
  for (const n of l.npcs) {
    const r = el("div", { className: "row" }, el("span", { className: "dim", textContent: n.name + ":" }));
    for (const t of n.topics) r.append(el("button", { textContent: t.id + (t.heard ? " \u2713" : ""), disabled: !exploring, onclick: () => cmd("talk", { npc: n.id, topic: t.id }) }));
    rows.push(r);
  }
  const act = el("div", { className: "row" },
    ...[["Search (1h)", () => cmd("search")], ["Short rest", () => cmd("rest", { kind: "short" })], ["Long rest", () => cmd("rest", { kind: "long" })], ["Wait 1h", () => cmd("wait", { hours: 1 })],
        ["Autopilot step", () => cmd("auto", { steps: 1 })], ["Autopilot x20", () => cmd("auto", { steps: 20 })]]
      .map(([t, f]) => el("button", { textContent: t, onclick: f, disabled: !exploring })),
    el("select", { onchange: e => cmd("pace", { pace: e.target.value }), disabled: !exploring }, ...["slow", "normal", "fast"].map(p => el("option", { value: p, textContent: "pace: " + p, selected: v.pace === p }))));
  rows.push(el("h2", { textContent: "Actions", style: "margin-top:12px" }), act);
  box.replaceChildren(...rows);
}
function renderParty() {
  const box = $("#party"); box.replaceChildren(el("h2", { textContent: "Party" }));
  for (const m of view.party) {
    const pct = Math.max(0, Math.round(100 * m.hp / m.maxHp));
    const slots = m.slots.map((n, i) => (m.slotsMax[i] ? `L${i}:${n}/${m.slotsMax[i]}` : "")).filter(Boolean).join(" ");
    box.append(el("div", { className: "member" + (m.dead ? " dead" : "") },
      el("div", {}, el("b", { textContent: m.name }), el("span", { className: "dim small", textContent: `  ${m.class} ${m.level}  AC ${m.ac}  HP ${m.hp}/${m.maxHp}` })),
      el("div", { className: "bar" }, el("i", { style: `width:${pct}%` })),
      el("div", { className: "dim small", textContent: `XP ${m.xp}${m.nextLevelXp ? "/" + m.nextLevelXp : ""}  potions ${m.potions}  dice ${m.hitDice}${m.exhaustion ? "  exhaustion " + m.exhaustion : ""}${slots ? "  " + slots : ""}` })));
  }
}
function renderQuests() {
  const box = $("#quests"); box.replaceChildren(el("h2", { textContent: "Quests" }));
  for (const q of view.quests) box.append(el("div", { className: "small", title: q.description, textContent: `${q.done ? "\u2611" : "\u2610"} ${q.name}`, style: q.done ? "color:var(--ok)" : "" }));
}

// ---------------------------------------------------------------- combat
function renderCombat() {
  const box = $("#combat"), c = view.combat;
  if (!c) { box.hidden = true; return; }
  box.hidden = false;
  const opts = c.options, byPos = new Map(c.actors.filter(a => a.life !== "dead").map(a => [a.pos.join(","), a]));
  const me = opts ? c.actors.find(a => a.id === opts.actor) : null;
  const w = c.grid.width;
  const grid = el("div", { id: "grid", style: `grid-template-columns:repeat(${w},26px)` });
  c.grid.rows.forEach((row, y) => [...row].forEach((ch, x) => {
    const a = byPos.get(`${x},${y}`);
    const cls = ["cell", ch === "#" ? "wall" : ch === "~" ? "rough" : ch === "c" ? "half" : ch === "O" ? "three" : ""];
    const cell = el("div", { textContent: a ? a.glyph : ch === "." ? "" : ch === "#" ? "" : ch });
    if (a) { cls.push(a.team === "party" ? "party" : "foe"); if (a.life !== "alive") cls.push("down"); if (a.id === c.current) cls.push("cur"); cell.title = `${a.name}  HP ${a.hp}/${a.maxHp}  AC ${a.ac}${a.effects.length ? "  " + a.effects.join(", ") : ""}`; }
    if (opts && me) {
      if (a && a.id !== me.id && a.life !== "dead") { cls.push("target"); cell.onclick = () => useOn(a); }
      else if (!a && ch !== "#") { cls.push("move"); cell.onclick = () => doAction({ type: "move", dest: [x, y] }); }
    }
    cell.className = cls.filter(Boolean).join(" "); grid.append(cell);
  }));
  const kids = [el("h2", { textContent: `Combat  |  round ${c.round}` + (c.finished ? "  |  over" : "") }), grid];
  if (opts && me) {
    kids.push(el("div", { className: "small dim", style: "margin-top:8px", textContent: `${me.name}: move ${opts.economy.movementFt} ft  ${opts.economy.action ? "[action] " : ""}${opts.economy.bonusAction ? "[bonus] " : ""}${opts.economy.attacksLeft ? "[" + opts.economy.attacksLeft + " attack(s) left]" : ""}  click a square to move, click a creature to use the selected option` }));
    const sel = (k, i) => pending.kind === k && pending.index === i;
    const row = el("div", { className: "row" });
    for (const a of opts.attacks) row.append(el("button", { className: sel("attack", a.index) ? "sel" : "", textContent: `${a.name} ${a.toHit >= 0 ? "+" : ""}${a.toHit} ${a.damage}`, onclick: () => { pending = { kind: "attack", index: a.index }; renderCombat(); } }));
    for (const s of opts.spells) row.append(el("button", { className: sel("spell", s.id) ? "sel" : "", disabled: !s.available, textContent: s.name + (s.level ? ` (L${s.level})` : ""), onclick: () => { pending = { kind: "spell", index: s.id }; renderCombat(); } }));
    kids.push(row);
    const row2 = el("div", { className: "row" },
      el("button", { textContent: "Dash", onclick: () => doAction({ type: "dash" }) }), el("button", { textContent: "Dodge", onclick: () => doAction({ type: "dodge" }) }),
      el("button", { textContent: `Potion (${opts.potions})`, disabled: !opts.potions, onclick: () => doAction({ type: "potion", target: me.id }) }));
    for (const f of opts.features) row2.append(el("button", { textContent: `${f.id} (${f.uses})`, disabled: !f.uses, onclick: () => doAction({ type: "feature", feature: f.id }) }));
    row2.append(el("button", { className: "primary", textContent: "End turn", onclick: () => doAction({ type: "end_turn" }) }));
    kids.push(row2);
    kids.push(el("div", { className: "row" }, el("span", { className: "dim small", textContent: "Swap role:" }),
      ...["player", "dm", "spectator"].map(r => el("button", { textContent: r, onclick: () => swapRole(r) }))));
  }
  box.replaceChildren(...kids);
}
function lowestSlot(level) {
  const opts = view.combat && view.combat.options; if (!opts) return 0;
  const me = view.combat.actors.find(a => a.id === opts.actor);
  const pm = view.party.find(m => me && m.name === me.name);
  const slots = (pm && pm.slots) || opts.slots || [];
  for (let l = Math.max(level, 1); l < slots.length; l++) if (slots[l] > 0) return l;
  return 0;
}
function useOn(target) {
  if (pending.kind === "spell") {
    const sp = view.combat.options.spells.find(s => s.id === pending.index);
    doAction({ type: "cast", spell: pending.index, target: target.id, slot: sp && sp.level ? lowestSlot(sp.level) : 0 });
  }
  else doAction({ type: "attack", target: target.id, attack: pending.index });
}
async function doAction(a) {
  if (busy || !gid) return; busy = true;
  const { data } = await api("POST", `/api/games/${gid}/action?since=${lastSeq}`, a); busy = false;
  if (data.ok === false) toast(data.reason || "refused");
  if (data.view) apply(data.view); else if (data.error) toast(data.error);
}
async function swapRole(r) {
  const { data } = await api("POST", `/api/games/${gid}/role?since=${lastSeq}`, { role: r });
  if (data.view) apply(data.view); else toast(data.error || "failed");
}

// ---------------------------------------------------------------- chrome
$("#saveBtn").onclick = async () => {
  const { status, data } = await api("GET", `/api/games/${gid}/save`);
  if (status !== 200) return toast("save failed");
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" })), download: `cppdnd-${gid}.json` }); a.click();
};
$("#newBtn").onclick = showStart;
showStart();
</script>
</body>
</html>
