<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CppDnD</title>
<style>
:root { --bg:#14121a; --panel:#1d1a26; --edge:#322d42; --text:#e6e1ee; --dim:#9a93ab; --accent:#c9a24d; --party:#4a8fe0; --foe:#d65a5a; --ok:#5fb37a; --bad:#d65a5a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--edge); }
header h1 { font-size:18px; margin:0; color:var(--accent); letter-spacing:.05em; }
header .sp { flex:1; }
main { display:grid; gap:12px; padding:12px 16px; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); }
@media (max-width:900px){ main { grid-template-columns:1fr; } }
.panel { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:12px; }
.panel h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600; }
button, select, input { font:inherit; color:var(--text); background:#2a2638; border:1px solid var(--edge); border-radius:6px; padding:6px 10px; }
button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--accent); } button:disabled { opacity:.45; cursor:not-allowed; }
button.primary { background:var(--accent); color:#1a1405; border-color:var(--accent); font-weight:600; }
button.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.dim { color:var(--dim); } .small { font-size:13px; }
#log { height:46vh; overflow:auto; font-size:13.5px; }
#log div { padding:1px 0; white-space:pre-wrap; }
#log .scene { color:var(--accent); margin-top:8px; font-weight:600; } #log .narration { color:#cdbfe6; font-style:italic; }
#log .quest, #log .rest, #log .travel { color:var(--ok); } #log .round_start { color:var(--dim); margin-top:6px; } #log .turn_start { color:#b9c7ff; }
#log .you { color:var(--accent); margin-top:6px; }
#log .death, #log .down { color:var(--bad); } #log .flavour { color:var(--dim); font-style:italic; padding-left:12px; }
.bar { height:6px; background:#0e0c14; border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--ok); }
.member { padding:6px 0; border-top:1px solid var(--edge); } .member:first-of-type { border-top:0; }
.member.dead { opacity:.45; text-decoration:line-through; }
.member.you { border-left:3px solid var(--accent); padding-left:8px; }
.member.pick { cursor:pointer; } .member.pick:hover, .member.pick:focus-visible { background:var(--edge); outline:0; }
.member.sel { background:var(--edge); } .sheet { background:#17141f; border:1px solid var(--edge); border-radius:6px; padding:8px 10px; margin:2px 0 8px; }
.sheet h3 { margin:10px 0 4px; font-size:13px; color:var(--accent); } .sheet .kvrow { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; }
.sheet table.abil { border-collapse:collapse; margin:8px 0; font-size:12px; } .abil th, .abil td { padding:1px 10px 1px 0; text-align:left; } .abil th { color:var(--dim); font-weight:normal; }
.wep { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0; font-size:12px; } select.give { max-width:48%; font-size:12px; }
#sessSel { max-width:min(420px, 40vw); }
.focus { display:flex; gap:8px; align-items:center; margin:2px 0 8px; } .focus select { flex:1; }
.pics .row { margin:6px 0; } .pics progress { width:100%; height:8px; } .pics .err { color:var(--bad); font-size:12px; }
.hist { max-height:260px; overflow:auto; font-size:13px; margin-top:6px; }
.hist div { padding:2px 0; } .hist .meta { color:var(--dim); font-size:11px; } .hist .from { color:var(--accent); }
.mapwrap { overflow:auto; max-height:440px; border:1px solid var(--edge); border-radius:6px; background:#1b2416; } canvas.worldmap { display:block; max-width:none; }
.quest { cursor:pointer; padding:2px 0; } .quest:hover, .quest:focus-visible { color:var(--accent); outline:0; } .questinfo { margin:0 0 6px 18px; padding-left:8px; border-left:2px solid var(--edge); }
.itemart { display:inline-block; flex:none; vertical-align:middle; line-height:0; } img.itemart { object-fit:cover; border-radius:6px; }
.strip { display:flex; gap:4px; align-items:center; margin:4px 0 2px; flex-wrap:wrap; } .strip .itemart { background:#14111c; border:1px solid var(--edge); border-radius:6px; padding:1px; } .stripp { display:inline-flex; align-items:center; gap:2px; }
.wepl { display:flex; gap:8px; align-items:center; }
.memory { margin:4px 0 8px 12px; padding:6px 8px; border-left:2px solid var(--edge); background:#17141f; border-radius:0 6px 6px 0; } .memwho { margin-top:6px; } .memline { margin:2px 0 2px 6px; line-height:1.3; }
.eqbox { border:1px solid var(--edge); border-radius:8px; padding:6px 8px 8px; margin:8px 0; background:#17141f; } .eqbox.stash { border-style:dashed; border-color:#8a6d2f; background:#1d1912; } .eqbox.dead { opacity:.45; }
.eqbox.target { border-color:var(--accent); cursor:pointer; } .eqbox.over { background:#2a2438; border-color:var(--accent); }
.eqhead { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.tiles { display:flex; flex-wrap:wrap; gap:6px; min-height:40px; } .tiles .empty { padding:8px 4px; }
.itm { width:84px; padding:4px; border:1px solid var(--edge); border-radius:8px; background:#201c2b; text-align:center; cursor:grab; user-select:none; } .itm:hover { border-color:var(--accent); } .itm.held { border-color:var(--accent); box-shadow:0 0 0 2px rgba(201,162,77,.45); background:#2c2536; }
.itmicon { position:relative; display:flex; justify-content:center; } .itm .badge { position:absolute; right:6px; bottom:0; background:var(--accent); color:#1a1405; font-size:11px; font-weight:700; border-radius:9px; padding:0 5px; }
.itmname { font-size:12px; font-weight:600; margin-top:2px; } .itmsub { font-size:10.5px; line-height:1.2; }
#grid { display:grid; gap:1px; background:#0c0a12; width:max-content; max-width:100%; overflow:auto; border:1px solid var(--edge); }
.cell { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font:700 13px ui-monospace, monospace; background:#262235 var(--tile-floor) center/100% 100%; user-select:none; position:relative; }
.cell.wall { background:#08070c var(--tile-wall) center/100% 100%; } .cell.rough { background:#322c3f var(--tile-rough) center/100% 100%; } .cell.half, .cell.three { background:#3a3326 var(--tile-cover) center/100% 100%; }
.cell svg.tok { width:30px; height:30px; display:block; }
.tok-sm { width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover; }
.cell.down { opacity:.5; }
.who { display:flex; gap:8px; align-items:center; }
.backdrop { width:100%; max-height:220px; object-fit:cover; border-radius:6px; margin-bottom:8px; display:block; }
.portrait { width:44px; height:44px; border-radius:6px; object-fit:cover; flex:none; } .cell.cur { outline:2px solid var(--accent); } .cell.target { cursor:crosshair; } .cell.move { cursor:pointer; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#3b1d24; border:1px solid var(--bad); padding:8px 14px; border-radius:6px; display:none; max-width:90vw; }
.start { max-width:560px; margin:30px auto; } .start label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
.start select, .start input { width:100%; }
.galgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; margin-top:8px; max-height:340px; overflow:auto; }
.galcell { margin:0; cursor:zoom-in; background:#0e0c14; border:1px solid var(--edge); border-radius:6px; overflow:hidden; } .galcell:hover { border-color:var(--accent); }
.galcell img { width:100%; aspect-ratio:1; object-fit:cover; display:block; } .galcell figcaption { font-size:11px; color:var(--dim); padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lightbox { align-items:center; } .lightlay { max-width:96vw; } .lightimg { max-width:96vw; max-height:84vh; display:block; margin:0 auto; border-radius:6px; }
.viewbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .viewmsg { flex:1; min-width:120px; } .viewmsg.err { color:var(--bad); }
.viewimg { width:100%; border-radius:6px; display:block; margin-bottom:6px; }
.camdlg { position:fixed; inset:0; background:rgba(8,6,12,.88); z-index:20; display:flex; align-items:flex-start; justify-content:center; padding:12px; overflow:auto; }
.camlay { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:12px; width:100%; max-width:1180px; }
.camgrid { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:14px; } @media (max-width:900px){ .camgrid { grid-template-columns:1fr; } }
.camcanvas { width:100%; aspect-ratio:16/9; background:#0c0a12; border:1px solid var(--edge); border-radius:6px; touch-action:none; cursor:grab; display:block; outline:none; }
.camcanvas:focus { border-color:var(--accent); }
.walkstage { position:relative; aspect-ratio:16/9; overflow:hidden; background:#0c0a12; border:1px solid var(--edge); border-radius:6px; outline:none; touch-action:none; cursor:grab; user-select:none; }
.walkstage:focus { border-color:var(--accent); }
.walkwire, .walkimg { position:absolute; inset:0; width:100%; height:100%; display:block; }
.walkimg { object-fit:cover; transition:transform .22s ease-out; pointer-events:none; transform-origin:50% 50%; }
.walkbadge, .walkhud { position:absolute; left:8px; font-size:12px; color:#ece8f5; background:rgba(12,10,18,.7); border-radius:4px; padding:2px 7px; pointer-events:none; }
.walkbadge { top:8px; } .walkbadge:empty { display:none; } .walkhud { bottom:8px; font-family:ui-monospace, monospace; }
.walkmini { position:absolute; right:8px; top:8px; border:1px solid rgba(236,232,245,.35); border-radius:4px; pointer-events:none; }
.walkpad { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:6px; }
.walklook { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
.walkpad button, .walklook button { background:rgba(12,10,18,.72); border:1px solid rgba(236,232,245,.4); color:#ece8f5; font-size:18px; min-width:42px; height:38px; border-radius:8px; cursor:pointer; padding:0 8px; }
.walkpad button:hover, .walklook button:hover { background:rgba(60,52,90,.9); border-color:var(--accent); }
.walkstrip { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; min-height:52px; }
.walkthumb { height:48px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; border:1px solid var(--edge); cursor:pointer; flex:none; }
.walkthumb:hover { border-color:var(--accent); }
.camnum { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; font-size:13px; } .camnum input { width:100%; }
.keys { font-size:12px; color:var(--dim); margin-top:6px; line-height:1.9; }
kbd { background:#2a2638; border:1px solid var(--edge); border-bottom-width:2px; border-radius:4px; padding:0 5px; margin:0 1px; font:11px ui-monospace, monospace; color:var(--text); }
/* UX layer */
.chips{margin-top:2px} .chip{border-radius:14px;font-size:12px;padding:3px 10px;opacity:.9}
.cell.reach{box-shadow:inset 0 0 0 100px rgba(95,176,255,.16)} .cell.inrange{outline:2px solid #e5c24a} .cell.outrange{outline:2px dashed #777;opacity:.8}
.cell .badge{position:absolute;right:0;bottom:0;background:#1b1726;color:#e5c24a;font:700 10px ui-monospace,monospace;padding:0 2px;border-radius:3px 0 0 0;pointer-events:none}
.cell .float{position:absolute;left:0;right:0;top:-2px;text-align:center;font:700 13px ui-monospace,monospace;pointer-events:none;animation:floatup 1.1s ease-out forwards;text-shadow:0 0 3px #000;z-index:3}
.float.hit{color:#ff8a7a}.float.crit{color:#ffd54a;font-size:16px}.float.miss{color:#bbb}.float.heal{color:#7be08a}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.cell.fx-hit{animation:shake .3s}.cell.fx-crit{animation:shake .4s,critglow .8s}.cell.fx-heal{animation:healglow .8s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes critglow{from{box-shadow:0 0 14px 4px #ffd54a}to{box-shadow:none}} @keyframes healglow{from{box-shadow:0 0 10px 3px #7be08a}to{box-shadow:none}}
@media (prefers-reduced-motion:reduce){.cell.fx-hit,.cell.fx-crit,.cell.fx-heal,.cell .float{animation:none}}
#grid{position:relative} #fxlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
#fxlayer .sprite{position:absolute;left:0;top:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;will-change:transform}
#fxlayer .bolt{position:absolute;left:11px;top:11px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 6px 3px var(--c),0 0 14px 6px var(--c)}
#fxlayer .bolt.soft{width:8px;height:8px;left:12px;top:12px;opacity:.85}
#fxlayer .burst{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 30%,transparent 70%);transform-origin:center}
#fxlayer .burst.ring{background:none;border:3px solid var(--c);box-shadow:0 0 10px var(--c),inset 0 0 10px var(--c)}
.cell.animhide > img, .cell.animhide > svg{visibility:hidden}
#herostrip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:6px 8px}
#herostrip .hero{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:18px;font-size:12px}
#herostrip .hero img,#herostrip .hero .init{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
#herostrip .hero .init{display:flex;align-items:center;justify-content:center;background:var(--party,#648fff);color:#fff;font-weight:700}
#herostrip .hero .nm{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
#herostrip .hpbar{width:48px;height:4px;background:#0006;border-radius:2px;overflow:hidden}#herostrip .hpbar i{display:block;height:100%}
#herostrip .hero.you{outline:2px solid var(--accent);background:#2b2540}#herostrip .hero.acting .init,#herostrip .hero.acting img{box-shadow:0 0 0 2px var(--accent)}
#log .expandable{cursor:pointer} #log .expandable:hover{text-decoration:underline dotted} #log .recap{color:var(--dim);border-left:3px solid var(--accent);padding-left:8px;margin-bottom:6px}
.uxdlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.uxbox{max-width:560px;width:92vw;max-height:80vh;overflow:auto}.uxset{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--text)}.jrow{padding:3px 0}
kbd{background:#2c2740;border:1px solid #4a4266;border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace}
body.cb .cell.party{outline:2px solid #648fff}body.cb .cell.foe{outline:2px dashed #ffb000}body.cb .cell.reach{box-shadow:inset 0 0 0 100px rgba(255,176,0,.18)}
button:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible,#log .expandable:focus-visible{outline:3px solid #fff;outline-offset:1px}
@media (max-width:820px){main{grid-template-columns:1fr !important}button{min-height:36px}}
/* tips: hover help, coach cards, the tutorial */
#hovertip{position:fixed;z-index:70;max-width:340px;background:#0f0d16;color:var(--text);border:1px solid var(--accent);border-radius:6px;padding:6px 9px;font-size:12.5px;line-height:1.45;white-space:pre-line;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.55);display:none}

.coach{background:#241f33;border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.55);font-size:13.5px}
.coach.tut{border-color:#7fb0ff;background:#1c2233}
.coach h3{margin:0 0 4px;font-size:14px;color:var(--accent)} .coach.tut h3{color:#a9c8ff} .coach p{margin:4px 0;white-space:pre-line}
.coach .row{justify-content:flex-end;margin:8px 0 0} .coach .step{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em} .coach .paused{font-size:11.5px;color:var(--dim);font-style:italic}

.legend{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--dim)} .legend span{white-space:nowrap} .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px;border:1px solid var(--edge)}

<body>
<header><h1>CppDnD</h1><span id="sub" class="dim small"></span><span class="sp"></span>
  <select id="sessSel" title="Sessions: every game is kept by the server, with all of its state, so you can switch between them"></select>
  <button id="sessName" title="Rename this session" hidden>Rename</button><button id="sessDel" title="Delete this session for good" hidden>Delete</button>
  <button id="saveBtn" hidden>Save</button><button id="newBtn" hidden>New game</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
let gid = null, view = null, lastSeq = 0, content = null, pending = { kind: "attack", index: 0 }, busy = false;

async function api(method, path, body) {
  try {
    const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({ error: "bad response" }));
    return { status: r.status, data };
  } catch (e) { return { status: 0, data: { error: "cannot reach the server" } }; }
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500); }

// ---------------------------------------------------------------- start screen
async function showStart() {
  gid = null; view = null; lastSeq = 0; lsSet(SESS_KEY, null); renderSessions();
  $("#saveBtn").hidden = $("#newBtn").hidden = true; $("#sub").textContent = "";
  const gen = startGen;
  if (!content) content = (await api("GET", "/api/content")).data;
  const llmInfo = (await api("GET", "/api/llm")).data;
  if (gen !== startGen) return;   // a game was opened (Learn combat, a session) while this screen was loading
  llmOn = !!llmInfo.enabled;
  agentsOn = !!(llmInfo.agents && llmInfo.agents.available);
  const mods = el("select", { id: "mod" }, el("option", { value: "", textContent: "Procedural delve (3 rooms)" }));
  const adventures = (content.modules || []).filter(m => !m.tutorial), lesson = (content.modules || []).find(m => m.tutorial);
  for (const m of adventures) mods.append(el("option", { value: m.id, textContent: `${m.name} (level ${m.recommendedLevel})` }));
  mods.value = adventures[0]?.id || "";
  const role = el("select", { id: "role" }, ...[["player", "Player (one hero)"], ["dm", "Dungeon Master (all monsters)"], ["spectator", "Spectator (AI plays)"]].map(([v, t]) => el("option", { value: v, textContent: t })));
  const hero = el("select", { id: "hero" });
  // each module has its own cast (data/modules/<id>/characters.json); the procedural delve uses the classic four
  const fillHero = () => {
    const cast = (content.characters || []).filter(c => mods.value ? c.module === mods.value : ["thorin", "elara", "aldric", "finn"].includes(c.id));
    hero.replaceChildren(...cast.map(c => el("option", { value: c.id, textContent: `${c.name} (${c.class})` })));
  };
  mods.onchange = fillHero;
  fillHero();
  const diff = el("select", { id: "diff" }, ...[["easy", "Easy"], ["medium", "Normal (recommended)"], ["hard", "Hard"], ["deadly", "Deadly"]].map(([v, t]) => el("option", { value: v, textContent: t })));
  diff.value = "medium";
  const agentsBox = el("input", { type: "checkbox", id: "agents", disabled: !agentsOn });
  const seed = el("input", { id: "seed", type: "number", placeholder: "random" });
  const file = el("input", { type: "file", accept: ".json" });
  const go = el("button", { className: "primary", textContent: "Begin", onclick: async () => {
    const body = { module: mods.value, role: role.value, hero: hero.value, difficulty: diff.value };

    x.fillStyle = "rgba(60,90,120,.9)"; x.beginPath(); x.arc(p.x, p.y, 5, 0, 7); x.fill(); x.strokeStyle = "rgba(170,160,140,.9)"; x.lineWidth = 2; x.stroke();
  } else if (n.kind === "wilderness") {

    for (let i = 0; i < count; i++) { const a = r() * 7, d = Math.sqrt(r()) * R * 0.82; spots.push([p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, 8 + r() * 8]); }

  }
}

// layout: [{id, x, y}] -> draw everything. m is the view's map, flags say how to dress each place.
function drawWorldMap(canvas, m, pos, o) {
  const doc = canvas.ownerDocument || document, W = o.W, H = o.H, dpr = o.dpr || 1;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const x = canvas.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.drawImage(wmBase(W, H, o.key || "map", doc), 0, 0);
  const byId = new Map(m.nodes.map(n => [n.id, n]));
  // roads: a dark verge, packed earth, a pale worn middle, ruts. Closed ways are barred and dimmer.
  const drawn = new Set(), labels = [];
  for (const e of m.edges) {
    const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) continue;
    const key = [e.from, e.to].sort().join("|"); if (drawn.has(key)) continue; drawn.add(key);
    const r = wmRng(wmHash(key)), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, bend = (r() - 0.5) * Math.min(70, len * 0.35);
    const cx = (a.x + b.x) / 2 - dy / len * bend, cy = (a.y + b.y) / 2 + dx / len * bend;
    const path = () => { x.beginPath(); x.moveTo(a.x, a.y); x.quadraticCurveTo(cx, cy, b.x, b.y); };
    x.lineCap = "round"; x.setLineDash([]);
    path(); x.strokeStyle = "rgba(10,12,6,.38)"; x.lineWidth = 12; x.stroke();
    x.save(); x.translate(2, 3); path(); x.strokeStyle = "rgba(0,0,0,.22)"; x.lineWidth = 9; x.stroke(); x.restore();
    path(); x.strokeStyle = e.open ? "#7a6340" : "#4c4034"; x.lineWidth = 8; x.stroke();
    path(); x.strokeStyle = e.open ? "#a68d60" : "#6a5a46"; x.lineWidth = 4.5; if (!e.open) x.setLineDash([9, 7]); x.stroke(); x.setLineDash([]);
    path(); x.strokeStyle = "rgba(60,44,26,.45)"; x.lineWidth = 0.8; x.stroke();
    if (!e.open) { const t = 0.5, mx = (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * cx + t * t * b.x, my = (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * cy + t * t * b.y; x.save(); x.translate(mx, my); x.fillStyle = "#3b2a1c"; x.strokeStyle = "#1a120b"; x.lineWidth = 1.5; x.fillRect(-9, -3, 18, 6); x.strokeRect(-9, -3, 18, 6); x.restore(); }
    const lbl = e.hours ? `${e.hours}h` : e.miles ? `${e.miles} mi` : "";
    if (lbl) labels.push([(a.x + 2 * cx + b.x) / 4, (a.y + 2 * cy + b.y) / 4 - 8, lbl]);
  }
  const places = [...m.nodes].sort((p, q) => pos.get(p.id).y - pos.get(q.id).y);
  for (const n of places) {
    const p = pos.get(n.id); wmPlace(x, n, p);
    if (!n.visited && !n.current) {   // not seen yet: a veil of fog over the place
      const f = x.createRadialGradient(p.x, p.y, 6, p.x, p.y, WM_R + 6); f.addColorStop(0, "rgba(20,22,30,.62)"); f.addColorStop(0.75, "rgba(20,22,30,.55)"); f.addColorStop(1, "rgba(20,22,30,0)");
      x.fillStyle = f; x.beginPath(); x.arc(p.x, p.y, WM_R + 6, 0, 7); x.fill();
      x.fillStyle = "rgba(235,230,215,.75)"; x.font = "700 22px Georgia, serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("?", p.x, p.y);
    }
    if (o.open.has(n.id)) {   // somewhere you can go now
      x.strokeStyle = "rgba(240,200,90,.9)"; x.lineWidth = 2.5; x.setLineDash([6, 4]); x.beginPath(); x.arc(p.x, p.y, 46, 0, 7); x.stroke(); x.setLineDash([]);
      const g = x.createRadialGradient(p.x, p.y, 36, p.x, p.y, 54); g.addColorStop(0, "rgba(240,200,90,0)"); g.addColorStop(0.7, "rgba(240,200,90,.22)"); g.addColorStop(1, "rgba(240,200,90,0)"); x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, 54, 0, 7); x.fill();
    }
  }
  x.font = "600 10px Georgia, serif"; x.textAlign = "center"; x.textBaseline = "middle";
  for (const [lx, ly, t] of labels) { const w = x.measureText(t).width + 10; x.fillStyle = "rgba(24,18,10,.78)"; x.beginPath(); x.roundRect ? x.roundRect(lx - w / 2, ly - 8, w, 16, 8) : x.rect(lx - w / 2, ly - 8, w, 16); x.fill(); x.fillStyle = "#e8d9b0"; x.fillText(t, lx, ly + 0.5); }
  // names, then the party's marker on top
  for (const n of places) {
    const p = pos.get(n.id), name = n.name.length > 26 ? n.name.slice(0, 25) + "…" : n.name;
    x.font = `${n.current ? 700 : 600} 13px Georgia, serif`; x.textAlign = "center"; x.textBaseline = "middle";
    x.lineJoin = "round"; x.lineWidth = 4; x.strokeStyle = "rgba(14,10,6,.9)"; x.strokeText(name, p.x, p.y + WM_R - 4);
    x.fillStyle = n.current ? "#ffe39a" : n.visited ? "#f1e6c8" : "#aeb0b8"; x.fillText(name, p.x, p.y + WM_R - 4);
  }
  const cur = m.nodes.find(n => n.current);
  if (cur) {
    const p = pos.get(cur.id), col = o.fighting ? [214, 90, 90] : [240, 200, 90];
    const g = x.createRadialGradient(p.x, p.y, 36, p.x, p.y, 62); g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(0.75, `rgba(${col},.3)`); g.addColorStop(1, `rgba(${col},0)`); x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, 62, 0, 7); x.fill();
    x.strokeStyle = `rgb(${col})`; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, 50, 0, 7); x.stroke();
    // the party: a round standard seen from above, set on the ring, with a shadow
    const sx = p.x, sy = p.y - 50;
    x.fillStyle = "rgba(0,0,0,.4)"; x.beginPath(); x.ellipse(sx + 4, sy + 6, 12, 9, 0, 0, 7); x.fill();
    const t = x.createRadialGradient(sx - 4, sy - 4, 2, sx, sy, 13); t.addColorStop(0, o.fighting ? "#f08080" : "#8fc2ff"); t.addColorStop(1, o.fighting ? "#7a1f1f" : "#1d4f99");
    x.fillStyle = t; x.beginPath(); x.arc(sx, sy, 12, 0, 7); x.fill(); x.strokeStyle = "#0b1a33"; x.lineWidth = 1.5; x.stroke();
    x.fillStyle = "#f4ead0"; x.beginPath(); x.arc(sx, sy, 3.8, 0, 7); x.fill();
  }
  // a soft vignette, like the edge of an old map
  const v = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.55); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.45)"); x.fillStyle = v; x.fillRect(0, 0, W, H);
}

// Place the nodes: columns by distance from the start (so the way in runs left to right), rows spread evenly, each nudged
// a little by its own hash so the map does not look like a table. Returns {pos, W, H}.
function wmLayout(m) {
  const nodes = m.nodes, byId = new Map(nodes.map(n => [n.id, n]));
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  for (const e of m.edges) if (byId.has(e.from) && byId.has(e.to)) { adj.get(e.from).add(e.to); adj.get(e.to).add(e.from); }
  const depth = new Map(), root = byId.has(m.start) ? m.start : nodes[0].id, q = [root]; depth.set(root, 0);
  while (q.length) { const a = q.shift(); for (const b of adj.get(a)) if (!depth.has(b)) { depth.set(b, depth.get(a) + 1); q.push(b); } }
  const extra = Math.max(...depth.values()) + 1; for (const n of nodes) if (!depth.has(n.id)) depth.set(n.id, extra);
  const layers = []; for (const n of nodes) (layers[depth.get(n.id)] ||= []).push(n);
  const cols = layers.filter(Boolean), COLW = 200, ROWH = 150, PAD = 100;
  const rows = Math.max(...cols.map(l => l.length)), H = Math.max(300, rows * ROWH + PAD), W = cols.length * COLW + PAD;
  const pos = new Map();
  cols.forEach((layer, ci) => {
    layer.sort((a, b) => a.name.localeCompare(b.name));
    const top = (H - layer.length * ROWH) / 2 + ROWH / 2;
    layer.forEach((n, ri) => { const r = wmRng(wmHash("p" + n.id)); pos.set(n.id, { x: PAD / 2 + COLW / 2 + ci * COLW + (r() - 0.5) * 36, y: top + ri * ROWH + (r() - 0.5) * 30 }); });
  });
  return { pos, W, H };
}

function renderMap() {
  const box = $("#map"), m = view.map; if (!box || !m) return;
  if (!m.nodes.length) { box.replaceChildren(el("h2", { textContent: "Map" }), el("div", { className: "dim small", textContent: "No world map for this game." })); return; }
  const { pos, W, H } = wmLayout(m);
  const exploring = view.mode === "exploring", fighting = view.mode === "combat";
  const open = new Set(exploring && view.location ? view.location.exits.filter(x => x.available).map(x => x.to) : []);
  const canvas = el("canvas", { className: "worldmap" });
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  drawWorldMap(canvas, m, pos, { W, H, dpr: Math.min(2, window.devicePixelRatio || 1), key: view.module.id, open, fighting });
  const hit = ev => { const r = canvas.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, py = (ev.clientY - r.top) * H / r.height;
    return m.nodes.find(n => { const p = pos.get(n.id); return Math.hypot(p.x - px, p.y - py) < 50; }); };
  canvas.onmousemove = ev => { const n = hit(ev); canvas.style.cursor = n && open.has(n.id) ? "pointer" : "default";
    canvas.title = n ? `${n.name}${n.current ? " (you are here)" : n.visited ? " (visited)" : " (not yet visited)"}` : ""; };
  canvas.onclick = ev => { const n = hit(ev); if (n && open.has(n.id)) cmd("travel", { to: n.id }); };
  const keep = box.querySelector(".mapwrap");
  const wrap = el("div", { className: "mapwrap" }, canvas);
  box.replaceChildren(el("h2", { textContent: "Map" }), wrap,
    el("div", { className: "dim small", textContent: "A top-down chart of the places you know. Fogged places are not yet visited. Click a ringed place to travel there." }));
  const cur = m.nodes.find(n => n.current);
  if (cur) { const p = pos.get(cur.id); wrap.scrollLeft = keep ? keep.scrollLeft : Math.max(0, p.x - wrap.clientWidth / 2); wrap.scrollTop = keep ? keep.scrollTop : Math.max(0, p.y - wrap.clientHeight / 2); }
}

// ---------------------------------------------------------------- what an NPC remembers
// Each NPC keeps its own private record of everyone it has dealt with, the party and other NPCs alike (GET /history/<name>).
const npcMem = {};   // npc id -> {partners:[{with,count,entries}]} while its memory is open
async function toggleMemory(n) {
  if (npcMem[n.id]) { delete npcMem[n.id]; return renderScene(); }
  const r = await api("GET", `/api/games/${gid}/history/${encodeURIComponent(n.name)}?limit=6`);
  if (r.status !== 200) return toast(r.data.error || "could not read that memory");
  npcMem[n.id] = r.data; renderScene();
}
function memoryPanel(n, rec) {
  const box = el("div", { className: "memory" });
  if (!rec.partners.length) box.append(el("div", { className: "dim small", textContent: `${n.name} has not dealt with anyone yet.` }));
  for (const p of rec.partners) {
    box.append(el("div", { className: "memwho" }, el("b", { textContent: p.with }), el("span", { className: "dim small", textContent: `  ${p.count} ${p.count === 1 ? "thing" : "things"} remembered` })));
    for (const e of p.entries) {
      const arrow = e.dir === "to" ? "\u2192" : "\u2190";   // to: they acted on the other; from: the other acted on them
      box.append(el("div", { className: "memline small" }, el("span", { className: "dim", textContent: `d${e.day} ${String(e.hour).padStart(2, "0")}h ${arrow} ` }), el("span", { textContent: e.text })));
    }
  }
  return box;
}

// ---------------------------------------------------------------- exploration
function renderScene() {
  const box = $("#scene"), v = view, l = v.location;
  if (v.mode === "complete" || v.mode === "defeated") {
    box.replaceChildren(el("h2", { textContent: v.mode === "complete" ? "The tale is told" : "The party has fallen" }),
      el("div", { className: "row" }, el("button", { className: "primary", textContent: "New game", onclick: showStart })));
    return;
  }
  const exploring = v.mode === "exploring";
  const back = artUrl("locations", l.id) || artUrl("modules", v.module.id);
  const rows = [...(back ? [el("img", { src: back, className: "backdrop", alt: "" })] : []), el("h2", { textContent: l.name }), el("div", { textContent: l.description }),
    el("div", { className: "dim small", textContent: `Resting here: ${l.rest}` })];
  const exits = el("div", { className: "row" });
  for (const x of l.exits) {
    const hrs = x.hours || (x.miles ? `${x.miles} mi` : "");
    exits.append(el("button", { textContent: `Go: ${x.name}${hrs ? ` (${hrs}${x.hours ? "h" : ""})` : ""}`, disabled: !exploring || !x.available, title: x.blocked || x.label,
      onclick: () => cmd("travel", { to: x.to }) }));
  }
  rows.push(el("h2", { textContent: "Paths", style: "margin-top:12px" }), exits);
  for (const n of l.npcs) {
    const np = artUrl("npcs", n.id);
    const r = el("div", { className: "row" }, ...(np ? [el("img", { src: np, className: "portrait", alt: "" })] : []), el("span", { className: "dim", textContent: n.name + ` (${n.gender ? n.gender + " " : ""}${n.type || "commoner"}):` }));
    for (const t of n.topics) r.append(el("button", { textContent: t.id + (t.heard ? " \u2713" : ""), disabled: !exploring, onclick: () => cmd("talk", { npc: n.id, topic: t.id }) }));
    r.append(el("button", { textContent: npcMem[n.id] ? "Hide memory" : "Memory", title: "What this person remembers of everyone they have dealt with", onclick: () => toggleMemory(n) }));
    rows.push(r);
    if (npcMem[n.id]) rows.push(memoryPanel(n, npcMem[n.id]));
  }
  const act = el("div", { className: "row" },
    ...[["Search (1h)", () => cmd("search")], ["Explore (2h)", () => cmd("explore")], ["Short rest", () => cmd("rest", { kind: "short" })], ["Long rest", () => cmd("rest", { kind: "long" })], ["Wait 1h", () => cmd("wait", { hours: 1 })],
        ["Autopilot step", () => cmd("auto", { steps: 1 })], ["Autopilot x20", () => cmd("auto", { steps: 20 })]]
      .map(([t, f]) => el("button", { textContent: t, onclick: f, disabled: !exploring })),
    el("select", { onchange: e => cmd("pace", { pace: e.target.value }), disabled: !exploring }, ...["slow", "normal", "fast"].map(p => el("option", { value: p, textContent: "pace: " + p, selected: v.pace === p }))));
  rows.push(el("h2", { textContent: "Actions", style: "margin-top:12px" }), act);
  box.replaceChildren(...rows);
}

    if (cell.onclick) { cell.tabIndex = 0; cell.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); cell.onclick(); } }; }
    if (who && who.effects && who.effects.length) cell.title += "\n" + who.effects.map(f => gloss(f) ? `${f}: ${gloss(f)}` : "").filter(Boolean).join("\n");
  });
  if (opts && me) {
    const reach = reachable(c, me, opts.economy.movementFt);
    cells.forEach((cell, i) => { const x = i % w, y = Math.floor(i / w); if (cell.classList.contains("move") && reach.has(`${x},${y}`)) { cell.classList.add("reach"); cell.title = `${reach.get(`${x},${y}`)} ft to get here`; } });
    const rows = (opts.preview || [])[pending.kind === "attack" ? pending.index : -1] || [];
    for (const p of rows) {
      const t = c.actors.find(a => a.id === p.target); if (!t) continue;
      const cell = cells[t.pos[1] * w + t.pos[0]]; if (!cell) continue;

      const badge = el("span", { className: "badge", textContent: p.legal ? `${p.hitPct}%` : "✕", "aria-hidden": "true" }); cell.append(badge);
      cell.title += p.legal ? `\n${p.hitPct}% to hit, about ${p.expected} damage${p.critPct >= 10 ? `, ${p.critPct}% crit` : ""}${p.mode ? ", " + p.mode : ""}${p.cover ? ", " + p.cover : ""}${p.sneak ? ", sneak attack" : ""}` : `\n${p.whyNot}`;
      cell.setAttribute("aria-label", cell.title);

  }
  for (const f of fx) {
    const t = c.actors.find(a => a.id === f.id), cell = t && cells[t.pos[1] * w + t.pos[0]]; if (!cell) continue;
    cell.classList.add("fx-" + f.kind); cell.append(el("span", { className: "float " + f.kind, textContent: f.kind === "miss" ? "miss" : f.amt ? (f.kind === "heal" ? "+" : "-") + f.amt : "" }));
  }

  if (opts && opts.preview && me) {

    if (info) box.append(el("div", { className: "small dim", textContent: `Best target for this attack: ${actorName(info.target)}, ${info.hitPct}% to hit, about ${info.expected} damage.` }));
  }
};

// ---- tips: hover help on anything with a title, coach cards that explain what just happened, and the combat tutorial
// Hover help: every title= in the page shows as a styled popover on hover and on keyboard focus (Esc hides it).
const hoverTip = el("div", { id: "hovertip", role: "tooltip" });
document.body.append(hoverTip);
let hoverFor = null;
function tipTextOf(n) {
  const t = n.getAttribute("title");
  if (t != null) { if (t) n.dataset.tip = t; n.removeAttribute("title"); }   // the native tooltip would show on top of ours
  return n.dataset.tip || "";
}
function hoverShow(n) {
  const t = tipTextOf(n); if (!t) return hoverHide();
  hoverFor = n; hoverTip.textContent = t; hoverTip.style.display = "block"; n.setAttribute("aria-describedby", "hovertip");
  const r = n.getBoundingClientRect(), w = hoverTip.offsetWidth, h = hoverTip.offsetHeight;
  const x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let y = r.bottom + 6; if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  hoverTip.style.left = x + "px"; hoverTip.style.top = y + "px";
}
function hoverHide() { if (hoverFor) hoverFor.removeAttribute("aria-describedby"); hoverFor = null; hoverTip.style.display = "none"; }
const tipHost = t => (t && t.closest ? t.closest("[title],[data-tip]") : null);
document.addEventListener("mouseover", ev => { const n = tipHost(ev.target); if (n !== hoverFor) n ? hoverShow(n) : hoverHide(); });
document.addEventListener("focusin", ev => { const n = tipHost(ev.target); n ? hoverShow(n) : hoverHide(); });
document.addEventListener("focusout", hoverHide);
document.addEventListener("scroll", hoverHide, true);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && hoverFor) hoverHide(); }, true);

// Coach cards: shown the first time something comes up. "Close" hides one until the page is loaded again;
// "Do not show again" hides it for good. Both are per browser (localStorage), like the other settings.
const TIPK = "cppdnd.tips";
const coach = Object.assign({ off: false, never: [], tutorialDone: false, tut: null }, (() => { try { return JSON.parse(lsGet(TIPK) || "{}"); } catch { return {}; } })());
if (!Array.isArray(coach.never)) coach.never = [];
if (ux.tipsSeen && !coach.never.includes("welcome")) coach.never.push("welcome");   // the old one-off tip card
const coachSave = () => lsSet(TIPK, JSON.stringify(coach));
const coachSeen = new Set();     // shown during this visit
let coachQ = [], coachCur = null, coachHeld = false, coachReplay = false;
const coachBox = el("div", { id: "coach", "aria-live": "polite" });
document.body.append(coachBox);

function coachOffer(id, title, body, anchor) {
  if (coachReplay || coach.off || coach.never.includes(id) || coachSeen.has(id) || (tut.on && TUT_OWNS.has(id))) return;
  if ((coachCur && coachCur.id === id) || coachQ.some(t => t.id === id)) return;
  coachQ.push({ id, title, body, anchor }); coachRender();
}
function coachDismiss(never) {
  if (!coachCur) return;
  if (never && !coach.never.includes(coachCur.id)) { coach.never.push(coachCur.id); coachSave(); }
  coachCur = null; coachRender(); coachResume();
}
const inFight = () => !!(view && view.mode === "combat" && view.combat && !view.combat.finished);
// (not before the first round: initiative has to be rolled before there is anything to read)
const coachPausing = () => inFight() && view.combat.round > 0 && view.combat.awaiting < 0 && !!(coachCur || (tut.on && TUT[tut.step] && TUT[tut.step].hold));
function card(kind, head, title, body, buttons) {
  return el("div", { className: "coach" + (kind ? " " + kind : ""), role: "dialog", "aria-label": title },
    ...(head ? [el("div", { className: "step", textContent: head })] : []), el("h3", { textContent: title }), el("p", { textContent: body }),
    ...(coachPausing() ? [el("div", { className: "paused", textContent: "The fight waits while this is open." })] : []),
    el("div", { className: "row" }, ...buttons));
}

  if (!coachCur && coachQ.length) { coachCur = coachQ.shift(); coachSeen.add(coachCur.id); }
  const kids = [];
  if (tut.on && TUT[tut.step]) kids.push(tutCard());
  if (coachCur) kids.push(card("", "Tip", coachCur.title, typeof coachCur.body === "function" ? coachCur.body() : coachCur.body,
    [el("button", { textContent: "Do not show again", onclick: () => coachDismiss(true) }), el("button", { className: "primary", textContent: "Close", onclick: () => coachDismiss(false) })]));

  coachHighlight();
}
function coachHighlight() {

  for (const f of [tut.on && TUT[tut.step] && TUT[tut.step].anchor, coachCur && coachCur.anchor]) {

// The computer's turns wait while a card is open, so it can be read before the next thing happens.
const coachBaseAdvance = advance;
advance = async function () { if (coachPausing()) { coachHeld = true; return; } return coachBaseAdvance(); };
function coachResume() { if (coachHeld && !coachPausing()) { coachHeld = false; setTimeout(advance, aiDelay()); } }

// ---- what the dice meant, in words, from the fields the engine puts on attack and save events
const actorOf = id => view && view.combat && view.combat.actors.find(a => a.id === id);
const ours = a => !!a && a.team === "party";
function explainRoll(e) {
  const a = actorName(e.actor) || "The attacker", t = actorName(e.target) || "the target";
  if (e.check === "save")
    return `${t} rolled a saving throw: d20 plus their bonus came to ${e.roll}${e.coverBonus ? ` (including +${e.coverBonus} for cover)` : ""}, against the caster's spell save DC of ${e.vs}. ${e.roll >= e.vs ? "That meets the DC, so they resisted." : "That is short of the DC, so they failed."}`;
  const bonus = e.roll - e.natural, kept = e.mode ? ` (with ${e.mode}: two d20s, keeping the ${e.mode === "advantage" ? "higher" : "lower"})` : "";
  const ac = e.coverBonus ? `${t}'s AC of ${e.vs - e.coverBonus}, +${e.coverBonus} for cover, ${e.vs}` : `${t}'s Armor Class (AC) of ${e.vs}`;
  const verdict = e.natural === 20 ? "A natural 20 always hits, and is a critical hit: the damage dice are rolled twice."
    : e.natural === 1 ? "A natural 1 always misses, whatever the bonus."
    : e.crit ? "It hits, and a hit from next to a helpless target is always critical: the damage dice are rolled twice."
    : e.roll >= e.vs ? `${e.roll} meets ${e.vs}, so it hits.` : `${e.roll} is short of ${e.vs}, so it misses.`;
  return `${a} rolled ${e.natural} on the d20${kept}, ${bonus >= 0 ? "+" : "-"}${Math.abs(bonus)} attack bonus, total ${e.roll}, against ${ac}. ${verdict}${e.amount > 0 ? ` ${e.amount} damage.` : ""}`;
}

// ---- coach tips raised by events
function coachOnEvent(e) {
  const a = actorOf(e.actor), t = actorOf(e.target);
  if (e.type === "info" && /^Initiative:/.test(e.text))
    coachOffer("initiative", "Who goes first", `Everyone rolled initiative: a d20 plus their Dexterity modifier. The highest goes first.\n${e.text.replace(/^Initiative:\s*/, "").replace(/\) /g, "),  ")}\n\nThe strip above the grid shows the order, with whoever is acting now highlighted. When everyone has had a turn, a new round starts. A round is about six seconds.`, () => $(".initstrip"));
  if (e.type === "combat_start" && view && view.module && view.module.id !== "tutorial" && !coach.tutorialDone && !tut.on)
    coachOffer("try_tutorial", "New to combat?", "The Training Yard walks you through one small fight step by step. Press Learn combat at the top whenever you like; this game is kept.");
  if (e.check === "attack") {
    if (e.opportunity) coachOffer("opportunity", "Opportunity attack", `${actorName(e.actor)} got a free swing at ${actorName(e.target)} for moving out of reach. Leaving an enemy's reach (5 ft for most weapons) lets it attack as a reaction, once per round. To avoid it, go around enemies or finish them first.\n\n${explainRoll(e)}`);
    else if (ours(a)) coachOffer("attack_result", "Reading an attack", `${explainRoll(e)}\n\nHover any attack line in the log for this breakdown, or click it for the raw dice.`, () => $("#log"));
    else if (ours(t)) coachOffer("defence", "Being attacked", `Monsters roll the same way you do, against your Armor Class (AC). ${explainRoll(e)}\n\nArmor, shields and cover all raise the number they need.`);
    if (e.natural === 20) coachOffer("critical", "Critical hit", "A natural 20 on the attack die always hits, whatever the AC, and is a critical hit: the damage dice are rolled twice. Melee hits on a target that is down or paralyzed are also critical.");
    else if (e.natural === 1) coachOffer("fumble", "A natural 1", "A 1 on the attack die always misses, however good the bonus is.");
    if (e.mode) coachOffer("advantage", e.mode === "advantage" ? "Advantage" : "Disadvantage", `That roll had ${e.mode}: two d20s were rolled and the ${e.mode === "advantage" ? "higher" : "lower"} one kept.\n\nAdvantage comes from things like attacking a target that is down, prone (in melee), blinded or restrained.\nDisadvantage comes from attacking someone who is dodging, from being poisoned, frightened or prone yourself, from shooting beyond normal range, or from shooting with an enemy right next to you.\nIf you have both, they cancel out.`);
    if (e.coverBonus) coachOffer("cover", "Cover", `${actorName(e.target)} was behind cover, which added +${e.coverBonus} to their AC. Half cover (a crate, c) is +2. Three-quarters cover (a pillar, O) is +5. A wall blocks the shot entirely. Cover between the attacker and the target counts, so you can use it too.`);
  }
  if (e.check === "save") coachOffer("saving_throw", "Saving throws", `Some spells do not roll to hit. Instead the target rolls a saving throw: a d20 plus their bonus for one ability (such as Dexterity or Constitution), against the caster's spell save DC.\n\n${explainRoll(e)}\n\nArea spells such as Shatter make everyone in the area roll, and on a success they take half damage.`);
  if (e.type === "down" && ours(t || a)) {
    const who = (actorOf(e.actor) || {}).name || "A hero";
    coachOffer("down", "Down, not dead", `${who} dropped to 0 HP and is unconscious. At the start of each of their turns they make a death save: a d20, where 10 or more is a success. Three successes and they are stable. Three failures and they die. A natural 20 gets them up with 1 HP, and a 1 counts as two failures. Being hit while down is also a failure.\n\nAny healing, from a potion or a spell, gets them straight back up.`);
  }
  if (e.type === "info" && /concentration/.test(e.text))
    coachOffer("concentration", "Concentration", "Some spells last only while the caster concentrates on them. Taking damage forces a Constitution save to keep it, against DC 10 or half the damage, whichever is higher. Dropping to 0 HP ends it, and so does casting another concentration spell.");
  const cond = e.type === "info" && /is now ([^.]+)\.$/.exec(e.text);
  if (cond && gloss(cond[1])) coachOffer("condition", "Conditions", `${actorName(e.target)} is now ${cond[1]}: ${gloss(cond[1])}\n\nHover a creature on the grid to see its conditions and what they do.`);
  if (e.type === "combat_end") coachOffer("victory", /^Victory/.test(e.text) ? "Victory" : "The fight is over", `${e.text}.\n\nXP adds up toward your next level, which you reach after a long rest. Spent spell slots and feature uses come back when you rest as well.`);
  if (e.type === "rest" && /long rest|hit dice/.test(e.text)) coachOffer("rest", "Resting", "A short rest (1 hour) lets each hero spend hit dice to heal. A long rest (8 hours) restores hit points, spell slots and class features, once a day. Resting somewhere risky can be interrupted by a fight.");
}

// ---- coach tips raised by what is on screen
function coachOnView(v) {
  if (v.mode === "exploring" && !tut.on && v.module.id !== "tutorial")
    coachOffer("welcome", "First time?", "Click a path to travel, click a person's topic to talk, or type what you want to do in plain English below. Press ? for the keys. In a fight, tips like this one explain what is going on as it happens.");
  if (!inFight()) return;
  const c = v.combat, o = c.options, me = o && c.actors.find(a => a.id === o.actor);
  const rows = c.grid.rows.join("");
  if (/[~cO]/.test(rows)) coachOffer("terrain", "Reading the grid", "Dark squares are walls. Speckled squares (~) are rough ground, which costs double movement. Crates (c) give half cover, +2 AC, and pillars (O) give three-quarters cover, +5 AC. The legend under the grid shows each one.", () => $(".legend"));
  if (!me) return;
  const eco = o.economy;
  coachOffer("your_turn", `${me.name}'s turn`, `On your turn you have:\n•  Movement: ${eco.movementFt} ft. Each square is 5 ft, diagonals too. You can split it before and after attacking.\n•  One action: attack, cast a spell, Dash, Dodge or use a potion.\n•  One bonus action, used by some spells and features.\n•  One reaction, used for opportunity attacks on other creatures' turns.\n\nShaded squares are where you can walk. Press End turn when you are done. Anything unused is lost.`, () => $(".econ"));
  if (eco.attacksLeft > 0 && !eco.action) coachOffer("extra_attack", "Extra Attack", `${me.name} has ${eco.attacksLeft} more attack(s) as part of this action. You can move between them, or switch targets.`);
  if (pending.kind === "attack") {
    const w = o.attacks.find(x => x.index === pending.index), pv = (o.preview || [])[pending.index] || [];
    const ok = pv.find(p => p.legal), bad = pv.find(p => !p.legal), ft = ok && c.actors.find(a => a.id === ok.target);
    if (w && ok && ft) coachOffer("hit_chance", "Your chance to hit", `Each foe you can reach shows your chance to hit with the selected attack (${w.name}). You hit when d20 ${w.toHit >= 0 ? "+" : "-"} ${Math.abs(w.toHit)} meets their AC, so against ${ft.name}'s AC ${ft.ac} you need ${Math.max(2, Math.min(20, ft.ac - w.toHit))} or more on the die. Hover a foe for the expected damage, then click it to attack.`, () => $("#grid .cell.inrange"));
    if (bad) coachOffer("out_of_range", "Out of reach", `The ✕ on ${actorName(bad.target)} means you cannot use ${w ? w.name : "this attack"} on them: ${bad.whyNot}. Move closer, or pick a ranged attack or a spell.`, () => $("#grid .cell.outrange"));
  }
  if (pending.kind === "spell") {

    if (sp) coachOffer("spells", "Casting spells", `${sp.name} is ${sp.level ? `a level ${sp.level} spell. Casting it uses a spell slot of that level or higher, and the party panel shows how many you have left` : "a cantrip, so you can cast it as often as you like"}. Its range is ${sp.rangeFt} ft${sp.bonusAction ? ", and it takes your bonus action instead of your action" : ""}.${sp.concentration ? " It needs concentration, so it lasts until you are hurt badly or cast another concentration spell." : ""}\n\nSome spells roll to hit like a weapon. Others make the target roll a saving throw against your spell save DC. Click a creature to cast it.`);
  }
}

// ---- the tutorial: a sequence of cards over the Training Yard; each step ends when the game shows it was done

// ---- animations: tokens walk the squares they moved through; spells fly from the caster and burst on the target.
// The server sends finished states, so each move event carries its path and the first event of a cast names the spell.
// Steps play one at a time; a moving token's real square stays hidden while a sprite walks there, and computer turns wait.
const ANIM_COLOURS = { fire: "#ff7a2e", cold: "#8fd8ff", lightning: "#fff36b", thunder: "#b9a6ff", acid: "#9be04a", poison: "#6fcf5a", necrotic: "#9b5cc9",
  radiant: "#ffe38a", force: "#e07aff", psychic: "#ff8fd0", healing: "#7be08a", buff: "#7fb4ff", condition: "#c08aff" };

const animMs = ms => ms * (ux.fast ? 0.5 : 1);

  const pid = a.team === "party" ? (view.party.find(p => p.name === a.name) || {}).id : a.monsterId, u = artUrl(a.team === "party" ? "characters" : "monsters", pid);
  return u ? el("img", { src: u, alt: "", style: "width:30px;height:30px" }) : tokenSvg(a);
}

function animShowFx(items) {   // the floating numbers and shakes, as renderCombat draws them

async function animMove(s) {

    const from = animXY([s.path[i - 2], s.path[i - 1]]), to = animXY([s.path[i], s.path[i + 1]]); if (!from || !to) break;
    const rough = view.combat.grid.rows[s.path[i + 1]][s.path[i]] === "~";
    await tween(animMs(rough ? 220 : 130), t => { sp.node.style.transform = `translate(${from[0] + (to[0] - from[0]) * t}px,${from[1] + (to[1] - from[1]) * t - 4 * Math.sin(Math.PI * t)}px)`; });
