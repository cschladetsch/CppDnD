<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CppDnD</title>
<style>
:root { --bg:#14121a; --panel:#1d1a26; --edge:#322d42; --text:#e6e1ee; --dim:#9a93ab; --accent:#c9a24d; --party:#4a8fe0; --foe:#d65a5a; --ok:#5fb37a; --bad:#d65a5a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--edge); }
header h1 { font-size:18px; margin:0; color:var(--accent); letter-spacing:.05em; }
header .sp { flex:1; }
main { display:grid; gap:12px; padding:12px 16px; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); }
@media (max-width:900px){ main { grid-template-columns:1fr; } }
.panel { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:12px; }
.panel h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600; }
button, select, input { font:inherit; color:var(--text); background:#2a2638; border:1px solid var(--edge); border-radius:6px; padding:6px 10px; }
button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--accent); } button:disabled { opacity:.45; cursor:not-allowed; }
button.primary { background:var(--accent); color:#1a1405; border-color:var(--accent); font-weight:600; }
button.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.dim { color:var(--dim); } .small { font-size:13px; }
#log { height:46vh; overflow:auto; font-size:13.5px; }
#log div { padding:1px 0; white-space:pre-wrap; }
#log .scene { color:var(--accent); margin-top:8px; font-weight:600; } #log .narration { color:#cdbfe6; font-style:italic; }
#log .quest, #log .rest, #log .travel { color:var(--ok); } #log .round_start { color:var(--dim); margin-top:6px; } #log .turn_start { color:#b9c7ff; }
#log .you { color:var(--accent); margin-top:6px; }
#log .death, #log .down { color:var(--bad); } #log .flavour { color:var(--dim); font-style:italic; padding-left:12px; }
.bar { height:6px; background:#0e0c14; border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--ok); }
.member { padding:6px 0; border-top:1px solid var(--edge); } .member:first-of-type { border-top:0; }
.member.dead { opacity:.45; text-decoration:line-through; }
.member.you { border-left:3px solid var(--accent); padding-left:8px; }
#sessSel { max-width:min(420px, 40vw); }
.focus { display:flex; gap:8px; align-items:center; margin:2px 0 8px; } .focus select { flex:1; }
.pics .row { margin:6px 0; } .pics progress { width:100%; height:8px; } .pics .err { color:var(--bad); font-size:12px; }
.hist { max-height:260px; overflow:auto; font-size:13px; margin-top:6px; }
.hist div { padding:2px 0; } .hist .meta { color:var(--dim); font-size:11px; } .hist .from { color:var(--accent); }
#grid { display:grid; gap:1px; background:#0c0a12; width:max-content; max-width:100%; overflow:auto; border:1px solid var(--edge); }
.cell { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font:700 13px ui-monospace, monospace; background:#262235 var(--tile-floor) center/100% 100%; user-select:none; position:relative; }
.cell.wall { background:#08070c var(--tile-wall) center/100% 100%; } .cell.rough { background:#322c3f var(--tile-rough) center/100% 100%; } .cell.half, .cell.three { background:#3a3326 var(--tile-cover) center/100% 100%; }
.cell svg.tok { width:30px; height:30px; display:block; }
.tok-sm { width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover; }
.cell.down { opacity:.5; }
.who { display:flex; gap:8px; align-items:center; }
.backdrop { width:100%; max-height:220px; object-fit:cover; border-radius:6px; margin-bottom:8px; display:block; }
.portrait { width:44px; height:44px; border-radius:6px; object-fit:cover; flex:none; } .cell.cur { outline:2px solid var(--accent); } .cell.target { cursor:crosshair; } .cell.move { cursor:pointer; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#3b1d24; border:1px solid var(--bad); padding:8px 14px; border-radius:6px; display:none; max-width:90vw; }
.start { max-width:560px; margin:30px auto; } .start label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
.start select, .start input { width:100%; }
.galgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; margin-top:8px; max-height:340px; overflow:auto; }
.galcell { margin:0; cursor:zoom-in; background:#0e0c14; border:1px solid var(--edge); border-radius:6px; overflow:hidden; } .galcell:hover { border-color:var(--accent); }
.galcell img { width:100%; aspect-ratio:1; object-fit:cover; display:block; } .galcell figcaption { font-size:11px; color:var(--dim); padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lightbox { align-items:center; } .lightlay { max-width:96vw; } .lightimg { max-width:96vw; max-height:84vh; display:block; margin:0 auto; border-radius:6px; }
.viewbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .viewmsg { flex:1; min-width:120px; } .viewmsg.err { color:var(--bad); }
.viewimg { width:100%; border-radius:6px; display:block; margin-bottom:6px; }
.camdlg { position:fixed; inset:0; background:rgba(8,6,12,.88); z-index:20; display:flex; align-items:flex-start; justify-content:center; padding:12px; overflow:auto; }
.camlay { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:12px; width:100%; max-width:1180px; }
.camgrid { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:14px; } @media (max-width:900px){ .camgrid { grid-template-columns:1fr; } }
.camcanvas { width:100%; aspect-ratio:16/9; background:#0c0a12; border:1px solid var(--edge); border-radius:6px; touch-action:none; cursor:grab; display:block; outline:none; }
.camcanvas:focus { border-color:var(--accent); }
.camnum { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; font-size:13px; } .camnum input { width:100%; }
.keys { font-size:12px; color:var(--dim); margin-top:6px; line-height:1.9; }
kbd { background:#2a2638; border:1px solid var(--edge); border-bottom-width:2px; border-radius:4px; padding:0 5px; margin:0 1px; font:11px ui-monospace, monospace; color:var(--text); }
</style>
</head>
<body>
<header><h1>CppDnD</h1><span id="sub" class="dim small"></span><span class="sp"></span>
  <select id="sessSel" title="Sessions: every game is kept by the server, with all of its state, so you can switch between them"></select>
  <button id="sessName" title="Rename this session" hidden>Rename</button><button id="sessDel" title="Delete this session for good" hidden>Delete</button>
  <button id="saveBtn" hidden>Save</button><button id="newBtn" hidden>New game</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
let gid = null, view = null, lastSeq = 0, content = null, pending = { kind: "attack", index: 0 }, busy = false;

async function api(method, path, body) {
  try {
    const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({ error: "bad response" }));
    return { status: r.status, data };
  } catch (e) { return { status: 0, data: { error: "cannot reach the server" } }; }
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500); }

// ---------------------------------------------------------------- start screen
async function showStart() {
  gid = null; view = null; lastSeq = 0; lsSet(SESS_KEY, null); renderSessions();
  $("#saveBtn").hidden = $("#newBtn").hidden = true; $("#sub").textContent = "";
  if (!content) content = (await api("GET", "/api/content")).data;
  const llmInfo = (await api("GET", "/api/llm")).data;
  llmOn = !!llmInfo.enabled;
  agentsOn = !!(llmInfo.agents && llmInfo.agents.available);
  const mods = el("select", { id: "mod" }, el("option", { value: "", textContent: "Procedural delve (3 rooms)" }));
  for (const m of content.modules || []) mods.append(el("option", { value: m.id, textContent: `${m.name} (level ${m.recommendedLevel})` }));
  mods.value = (content.modules || [])[0]?.id || "";
  const role = el("select", { id: "role" }, ...[["player", "Player (one hero)"], ["dm", "Dungeon Master (all monsters)"], ["spectator", "Spectator (AI plays)"]].map(([v, t]) => el("option", { value: v, textContent: t })));
  const hero = el("select", { id: "hero" }, ...(content.characters || []).filter(c => ["thorin", "elara", "aldric", "finn"].includes(c.id)).map(c => el("option", { value: c.id, textContent: `${c.name} (${c.class})` })));
  const diff = el("select", { id: "diff" }, ...[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"], ["deadly", "Deadly"]].map(([v, t]) => el("option", { value: v, textContent: t })));
  diff.value = "hard";
  const agentsBox = el("input", { type: "checkbox", id: "agents", disabled: !agentsOn });
  const seed = el("input", { id: "seed", type: "number", placeholder: "random" });
  const file = el("input", { type: "file", accept: ".json" });
  const go = el("button", { className: "primary", textContent: "Begin", onclick: async () => {
    const body = { module: mods.value, role: role.value, hero: hero.value, difficulty: diff.value };
    if (seed.value) body.seed = Number(seed.value);
    if (agentsBox.checked) body.agents = true;
    const { status, data } = await api("POST", "/api/games", body);
    if (status !== 201) return toast(data.error || "could not start");
    startGame(data.id, data.view);
  } });
  file.onchange = async () => {
    const text = await file.files[0].text(); let save; try { save = JSON.parse(text); } catch { return toast("not a valid save file"); }
    const { status, data } = await api("POST", "/api/games/load", save);
    if (status !== 201) return toast(data.error || "could not load");
    startGame(data.id, data.view);
  };
  $("#app").replaceChildren(el("div", { className: "panel start" }, el("h2", { textContent: "New game" }),
    el("label", { textContent: "Module" }), mods, el("label", { textContent: "Role" }), role, el("label", { textContent: "Hero" }), hero, el("label", { textContent: "Difficulty" }), diff,
    el("label", { textContent: "AI table" }), el("label", { style: "display:flex;gap:8px;align-items:center;color:var(--text)" }, agentsBox,
      el("span", { textContent: agentsOn ? "every actor is its own model (agents.json); slower" : "not available: no agents.json found" })),
    el("label", { textContent: "Seed (optional, reproducible)" }), seed, el("div", { className: "row" }, go),
    el("label", { textContent: "Or load a save file" }), file));
}

function startGame(id, v) {
  gid = id; lastSeq = 0; lastView = null; viewMsg = { text: "", bad: false }; pending = { kind: "attack", index: 0 };
  lsSet(SESS_KEY, id); refreshSessions();
  $("#app").replaceChildren(el("main", {},
    el("div", {}, el("div", { className: "panel", id: "viewbar", style: "margin-bottom:12px" }), el("div", { className: "panel", id: "viewport", hidden: true, style: "margin-bottom:12px" }), el("div", { className: "panel", id: "scene" }), el("div", { className: "panel", id: "combat", hidden: true }), el("div", { className: "panel", id: "log" }), sayBox()),
    el("div", {}, el("div", { className: "panel", id: "map" }), el("div", { className: "panel", id: "party", style: "margin-top:12px" }), el("div", { className: "panel", id: "quests", style: "margin-top:12px" }), el("div", { className: "panel", id: "table", hidden: true, style: "margin-top:12px" }), picturesPanel(), galleryPanel(), historyPanel())));
  $("#saveBtn").hidden = $("#newBtn").hidden = false;
  loadArt().then(() => { if (view) { renderScene(); renderParty(); renderCombat(); } });
  apply(v);
}


// ---------------------------------------------------------------- art: pictures when they exist, drawn tokens otherwise
let art = {};
async function loadArt() {
  const r = await api("GET", "/api/art");
  art = r.status === 200 && r.data && r.data.enabled !== false ? r.data : {};
}
function artUrl(kind, id) { const f = art[kind] && art[kind][id]; return f ? (art.base || "/art/") + f : ""; }
const ICONS = {
  fighter: "M12 3l2 2-1 8 3 1v2h-3v4h-2v-4H8v-2l3-1-1-8z",
  wizard: "M12 2l5 14H7zM5 18h14v2H5zM12 7l1 2h2l-1.6 1.2.6 2L12 11l-2 1.2.6-2L9 9h2z",
  cleric: "M10 3h4v6h6v4h-6v8h-4v-8H4V9h6z",
  rogue: "M13 3l3 3-5 9 2 2-2 4-2-2-4 1 1-4 2 1 5-9z",
  ranger: "M6 3c8 1 13 7 13 15-3-3-4-6-4-9-4 0-7 2-9 6V3zM4 20l14-14 1 1L5 21z",
  barbarian: "M5 4c5-2 10 0 12 5l3 11-3-1-2-8-4 3 1 6-3 1-1-7-3-1z",
  undead: "M12 3c5 0 8 3 8 8 0 3-1 4-2 5v3h-3v-2h-2v2h-2v-2H9v2H6v-3c-1-1-2-2-2-5 0-5 3-8 8-8zM9 9a2 2 0 100 4 2 2 0 000-4zm6 0a2 2 0 100 4 2 2 0 000-4z",
  beast: "M7 4c2 0 3 2 3 4S9 11 7 11 4 9 4 7s1-3 3-3zm10 0c2 0 3 1 3 3s-1 4-3 4-3-1-3-3 1-4 3-4zM12 12c4 0 7 4 7 7 0 2-2 2-4 1-1-.5-2-.5-3-.5s-2 0-3 .5c-2 1-4 1-4-1 0-3 3-7 7-7z",
  humanoid: "M12 3a4 4 0 110 8 4 4 0 010-8zM5 21c0-5 3-8 7-8s7 3 7 8z",
  giant: "M3 9l4 3 2-6 3 4 3-4 2 6 4-3-2 12H5z",
  construct: "M12 2l2 3h4l1 4 3 2-3 2-1 4h-4l-2 3-2-3H6l-1-4-3-2 3-2 1-4h4z",
  other: "M12 3l9 18H3z",
};
function iconFor(a) {
  if (a.team === "party" && ICONS[a.classId]) return a.classId;
  const tags = a.tags || [];
  for (const t of ["undead", "beast", "giant", "construct", "humanoid"]) if (tags.includes(t)) return t;
  return ICONS[a.classId] ? a.classId : "other";
}
// a round token: team colour, class or creature icon, a health ring, and a pip for each condition
function tokenSvg(a) {
  const col = a.team === "party" ? "#5fb0ff" : "#e0584f", frac = a.maxHp ? Math.max(0, Math.min(1, a.hp / a.maxHp)) : 0;
  const C = 2 * Math.PI * 14, ring = frac > .5 ? "#6fcf7a" : frac > .25 ? "#e5c24a" : "#e0584f";
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 32 32"); svg.setAttribute("class", "tok");
  const pips = (a.effects || []).slice(0, 4).map((e, i) => `<circle cx="${6 + i * 7}" cy="29" r="2.4" fill="#e5c24a" stroke="#1b1726" stroke-width=".8"><title>${e}</title></circle>`).join("");
  svg.innerHTML = `<circle cx="16" cy="16" r="14" fill="#1b1726" stroke="#0c0a12" stroke-width="3"/>
    <circle cx="16" cy="16" r="14" fill="none" stroke="${ring}" stroke-width="2.4" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 16 16)"/>
    <circle cx="16" cy="16" r="11" fill="${col}" opacity=".9"/>
    <g transform="translate(8.5 8.5) scale(.625)" fill="#0b0f1a"><path d="${ICONS[iconFor(a)]}"/></g>${pips}`;
  return svg;
}
function picOrToken(kind, id, a, cls) {
  const u = artUrl(kind, id);
  if (u) return el("img", { src: u, className: cls || "portrait", alt: "", loading: "lazy" });
  return a ? tokenSvg(a) : document.createTextNode("");
}
const tile = svg => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>${svg}</svg>`)}")`;
function installTiles() {
  const r = document.documentElement.style;
  r.setProperty("--tile-floor", tile("<path d='M0 0h32v32H0z' fill='none'/><path d='M0 16h32M16 0v16M8 16v16M24 16v16' stroke='#33304a' stroke-width='1' opacity='.55'/>"));
  r.setProperty("--tile-wall", tile("<path d='M0 0h32v32H0z' fill='#14111c'/><path d='M0 8h32M0 16h32M0 24h32M8 0v8M24 0v8M16 8v8M0 8v8M32 8v8M8 16v8M24 16v8M16 24v8' stroke='#2c2740' stroke-width='1.4'/>"));
  r.setProperty("--tile-rough", tile("<g fill='#4a4260' opacity='.7'><circle cx='8' cy='9' r='2.4'/><circle cx='22' cy='7' r='1.8'/><circle cx='14' cy='20' r='2.8'/><circle cx='26' cy='24' r='2'/><circle cx='5' cy='26' r='1.6'/></g>"));
  r.setProperty("--tile-cover", tile("<rect x='5' y='9' width='22' height='15' rx='2' fill='#5a4a32' stroke='#2e2518' stroke-width='1.4'/><path d='M5 15h22M5 20h22' stroke='#2e2518' stroke-width='1'/>"));
}
installTiles();

// ---------------------------------------------------------------- plain English
let llmOn = false, agentsOn = false;
function sayBox() {
  const input = el("input", { id: "sayText", type: "text", autocomplete: "off", style: "flex:1;min-width:0",
    placeholder: llmOn ? "Say or do something, in English (e.g. go to the village and ask Marta about rumours)" : "Type a command: go to the village, ask Marta, search, long rest, wait 3 hours (start with --ollama MODEL for free-form English)" });
  const btn = el("button", { className: "primary", textContent: "Send" });
  const form = el("form", { className: "panel row", id: "say", style: "flex-wrap:nowrap;align-items:center" }, input, btn);
  form.onsubmit = async e => {
    e.preventDefault();
    const text = input.value.trim(); if (!text || busy || !gid) return;
    busy = true; btn.disabled = input.disabled = true; btn.textContent = "...";
    logLine("you", "> " + text);
    const { data } = await api("POST", `/api/games/${gid}/say?since=${lastSeq}`, { text });
    busy = false; btn.disabled = input.disabled = false; btn.textContent = "Send"; input.value = ""; input.focus();
    if (data.view) apply(data.view);
    if (data.message) logLine("narration", data.message);
    else if (data.error) toast(data.error);
  };
  return form;
}
function logLine(cls, text) { const log = $("#log"); if (!log) return; log.append(el("div", { className: cls, textContent: text })); log.scrollTop = log.scrollHeight; }

// ---------------------------------------------------------------- state
function logEvents(events) {
  const log = $("#log"); if (!log) return;
  for (const e of events) {
    if (e.seq <= lastSeq) continue; lastSeq = e.seq;
    const d = el("div", { className: e.type, textContent: e.text }); log.append(d);
    if (e.flavour) log.append(el("div", { className: "flavour", textContent: e.flavour }));
  }
  log.scrollTop = log.scrollHeight;
}
function apply(v) {
  view = v; logEvents(v.events || []);
  const cb = v.combat, cur = cb && !cb.finished ? cb.actors.find(a => a.id === cb.current) : null;
  const turn = cb ? `  |  round ${cb.round}${cur ? `, turn: ${cur.name}${cb.awaiting === cur.id ? " (waiting for you)" : ""}` : ""}` : "";
  $("#sub").textContent = `${v.module.name}  |  day ${v.clock.day}, ${String(v.clock.clockHour).padStart(2, "0")}:00${v.clock.night ? " (night)" : ""}  |  ${v.mode}${turn}`;
  renderMap(); renderViewBar(); renderScene(); renderParty(); renderQuests(); renderCombat(); refreshTable(); refreshHistory();
  if (v.mode === "combat" && v.combat && !v.combat.finished && v.combat.awaiting < 0 && !busy) setTimeout(advance, 120);
}
async function advance() {
  if (busy || !gid) return; busy = true;
  const { status, data } = await api("POST", `/api/games/${gid}/advance?since=${lastSeq}`); busy = false;
  if (status !== 200) return toast(data.error || "advance failed");
  apply(data.view);
}
async function cmd(path, body = {}) {
  if (busy || !gid) return; busy = true;
  const { data } = await api("POST", `/api/games/${gid}/${path}?since=${lastSeq}`, body); busy = false;
  if (data.ok === false && data.message) toast(data.message);
  if (data.ok === false && data.reason) toast(data.reason);
  if (data.view) apply(data.view); else if (data.error) toast(data.error);
}

// ---------------------------------------------------------------- AI table (agents)
let tableBusy = false;
async function refreshTable() {
  const box = $("#table"); if (!box) return;
  if (!view.llm || !view.llm.agents) { box.hidden = true; return; }
  if (tableBusy) return; tableBusy = true;
  const { data } = await api("GET", `/api/games/${gid}/agents`); tableBusy = false;
  if (!data.enabled) { box.hidden = true; return; }
  box.hidden = false;
  const rows = data.agents.map(a => el("div", { className: "small", style: "padding:2px 0", title: a.persona,
    textContent: `${a.name}  [${a.selector}]  ${a.model}  ${a.calls} call(s)${a.failures ? `, ${a.failures} failed` : ""}${a.modelStore && a.modelStore.exists ? "  (in store)" : ""}` }));
  const sels = [...new Set([...data.agents.map(a => a.selector), "type:undead", "type:beast", "type:humanoid", "type:giant"])];
  const sel = el("select", {}, ...sels.map(s => el("option", { value: s, textContent: s })));
  const model = el("input", { type: "text", placeholder: "model name", style: "flex:1;min-width:0" });
  const store = el("input", { type: "checkbox" });
  const go = el("button", { textContent: "Switch", onclick: async () => {
    const r = await api("POST", `/api/games/${gid}/agents/model`, { selector: sel.value, model: model.value.trim(), fromStore: store.checked });
    if (!r.data.ok) toast(r.data.error || "could not switch"); else { model.value = ""; refreshTable(); }
  } });
  const kids = [el("h2", { textContent: "AI table" }), ...rows];
  for (const p of data.problems || []) kids.push(el("div", { className: "small", style: "color:var(--bad)", textContent: p }));

          el("h2", { textContent: "Draw", style: "margin-top:10px" }),
          el("label", { className: "small" }, useInit, " start from the live preview (the picture follows what you see)"),
          el("div", { className: "small dim", style: "margin-top:6px" }, "Freedom ", strengthVal, ": low keeps close to the preview, high lets the model invent more"), strength,
          el("div", { className: "row" }, drawBtn, el("span", { className: "viewmsg small dim", textContent: viewMsg.text })),
          el("div", { className: "dim small", textContent: "The preview is a plain stand-in: blue is your party, red is foes, green is other people. The model paints over it." })))));

  const onKey = e => {
    if (!camOpen) return;
    const tag = (e.target && e.target.tagName) || "";
    if (e.code === "Escape" && tag !== "SELECT") { close(); return; }
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (/^(Key[WASDQEC]|Space|Arrow(Left|Right|Up|Down)|Shift(Left|Right))$/.test(e.code)) { camKeys.add(e.code); e.preventDefault(); }
  };

  window.addEventListener("keydown", onKey); window.addEventListener("keyup", onKeyUp); window.addEventListener("blur", onBlur);

  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("pointerdown", e => { camDrag = { x: e.clientX, y: e.clientY, pan: e.button !== 0 }; canvas.setPointerCapture(e.pointerId); canvas.focus(); canvas.style.cursor = "grabbing"; });
  canvas.addEventListener("pointermove", e => {
    if (!camDrag) return;
    const k = CAM_W / canvas.getBoundingClientRect().width, dx = (e.clientX - camDrag.x) * k, dy = (e.clientY - camDrag.y) * k;
    camDrag.x = e.clientX; camDrag.y = e.clientY;
    if (camDrag.pan) {
      const y = cam.yaw * Math.PI / 180; cam.x += Math.cos(y) * -dx * 0.012; cam.y += Math.sin(y) * -dx * 0.012; cam.z += dy * 0.012;
    } else { cam.yaw += dx * 0.15 * (cam.fov / 70); cam.pitch -= dy * 0.15 * (cam.fov / 70); }

  canvas.addEventListener("pointerup", endDrag); canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("wheel", e => {
    e.preventDefault();

    else { const B = camBasis(cam), s = -e.deltaY * 0.01; cam.x += B.f[0] * s; cam.y += B.f[1] * s; cam.z += B.f[2] * s; }
    camClamp(cam); camDirty = true; camSync();
  }, { passive: false });

  document.body.append(dlg);
  camTime = performance.now();
  const frame = t => {
    if (!camOpen) return;
    const dt = Math.min(0.1, (t - camTime) / 1000); camTime = t;
    camStep(dt);
    if (camDirty) { camRender(ctx, true); camDirty = false; camSync(); }

}

// ---------------------------------------------------------------- gallery: every stored picture
let galOpen = false, galItems = [], galFilter = "", galTimer = 0;
const GAL_KINDS = ["characters", "monsters", "npcs", "locations", "modules", "views"];
function galleryPanel() {
  return el("details", { className: "panel gallery", style: "margin-top:12px", ontoggle: e => { galOpen = e.target.open; refreshGallery(); } },
    el("summary", { textContent: "Gallery" }), el("div", { id: "gallery" }));
}
async function refreshGallery() {
  clearTimeout(galTimer);
  const box = $("#gallery"); if (!box || !galOpen) return;
  const { status, data } = await api("GET", "/api/art/list");
  if (status !== 200 || data.enabled === false) { box.replaceChildren(el("div", { className: "dim small", textContent: "The art folder is off, so there is nothing to show." })); return; }
  galItems = data.items || [];
  renderGallery();
  galTimer = setTimeout(refreshGallery, 5000);   // pictures keep arriving while the model draws
}
function renderGallery() {
  const box = $("#gallery"); if (!box) return;
  const counts = {}; for (const i of galItems) counts[i.kind] = (counts[i.kind] || 0) + 1;
  const shown = galItems.filter(i => !galFilter || i.kind === galFilter);
  const filter = el("select", { onchange: e => { galFilter = e.target.value; renderGallery(); } },
    el("option", { value: "", textContent: `all (${galItems.length})`, selected: !galFilter }),
    ...GAL_KINDS.filter(k => counts[k]).map(k => el("option", { value: k, textContent: `${k} (${counts[k]})`, selected: galFilter === k })));
  const grid = el("div", { className: "galgrid" });
  shown.forEach((it, n) => grid.append(el("figure", { className: "galcell", title: `${it.kind}/${it.id}`, onclick: () => openLightbox(shown, n) },
    el("img", { src: it.url, alt: it.id, loading: "lazy" }), el("figcaption", { textContent: it.kind === "views" ? "view" : it.id }))));
  box.replaceChildren(el("div", { className: "row", style: "align-items:center" }, filter,
      el("span", { className: "dim small", textContent: galItems.length ? `${(t => t >= 1048576 ? (t / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(t / 1024)) + " KB")(galItems.reduce((s, i) => s + i.bytes, 0))} in sim/art` : "" })),
    galItems.length ? grid : el("div", { className: "dim small", textContent: "No pictures yet. Draw some with the buttons above, the Pictures panel, or the camera." }));
}
function openLightbox(list, start) {
  let n = start;
  const img = el("img", { className: "lightimg", alt: "" }), cap = el("div", { className: "dim small", style: "text-align:center;margin-top:6px" });
  const show = d => { n = (n + d + list.length) % list.length; img.src = list[n].url; cap.textContent = `${list[n].kind}/${list[n].id}   (${n + 1} of ${list.length})`; };
  const close = () => { window.removeEventListener("keydown", onKey); dlg.remove(); };
  const onKey = e => { if (e.code === "Escape") close(); else if (e.code === "ArrowRight") show(1); else if (e.code === "ArrowLeft") show(-1); };
  const dlg = el("div", { className: "camdlg lightbox", onmousedown: e => { if (e.target === dlg) close(); } },
    el("div", { className: "lightlay" }, img, cap,
      el("div", { className: "row", style: "justify-content:center" }, el("button", { textContent: "Previous", onclick: () => show(-1) }), el("button", { textContent: "Next", onclick: () => show(1) }), el("button", { textContent: "Close (Esc)", onclick: close }))));
  window.addEventListener("keydown", onKey); document.body.append(dlg); show(0);
}
// ---------------------------------------------------------------- boot: reopen the session that was open, otherwise the start screen
(async () => {
  await refreshSessions();
  const last = lsGet(SESS_KEY);
  if (last && sessions.some(x => x.id === last) && await openSession(last)) return;
  showStart();
})();
