<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CppDnD</title>
<style>
:root { --bg:#14121a; --panel:#1d1a26; --edge:#322d42; --text:#e6e1ee; --dim:#9a93ab; --accent:#c9a24d; --party:#4a8fe0; --foe:#d65a5a; --ok:#5fb37a; --bad:#d65a5a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--edge); }
header h1 { font-size:18px; margin:0; color:var(--accent); letter-spacing:.05em; }
header .sp { flex:1; }
main { display:grid; gap:12px; padding:12px 16px; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); }
@media (max-width:900px){ main { grid-template-columns:1fr; } }
.panel { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:12px; }
.panel h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600; }
button, select, input { font:inherit; color:var(--text); background:#2a2638; border:1px solid var(--edge); border-radius:6px; padding:6px 10px; }
button { cursor:pointer; } button:hover:not(:disabled) { border-color:var(--accent); } button:disabled { opacity:.45; cursor:not-allowed; }
button.primary { background:var(--accent); color:#1a1405; border-color:var(--accent); font-weight:600; }
button.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.dim { color:var(--dim); } .small { font-size:13px; }
#log { height:46vh; overflow:auto; font-size:13.5px; }
#log div { padding:1px 0; white-space:pre-wrap; }
#log .scene { color:var(--accent); margin-top:8px; font-weight:600; } #log .narration { color:#cdbfe6; font-style:italic; }
#log .quest, #log .rest, #log .travel { color:var(--ok); } #log .round_start { color:var(--dim); margin-top:6px; } #log .turn_start { color:#b9c7ff; }
#log .you { color:var(--accent); margin-top:6px; }
#log .death, #log .down { color:var(--bad); } #log .flavour { color:var(--dim); font-style:italic; padding-left:12px; }
.bar { height:6px; background:#0e0c14; border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--ok); }
.member { padding:6px 0; border-top:1px solid var(--edge); } .member:first-of-type { border-top:0; }
.member.dead { opacity:.45; text-decoration:line-through; }
.member.you { border-left:3px solid var(--accent); padding-left:8px; }
.focus { display:flex; gap:8px; align-items:center; margin:2px 0 8px; } .focus select { flex:1; }
.pics .row { margin:6px 0; } .pics progress { width:100%; height:8px; } .pics .err { color:var(--bad); font-size:12px; }
.hist { max-height:260px; overflow:auto; font-size:13px; margin-top:6px; }
.hist div { padding:2px 0; } .hist .meta { color:var(--dim); font-size:11px; } .hist .from { color:var(--accent); }
#grid { display:grid; gap:1px; background:#0c0a12; width:max-content; max-width:100%; overflow:auto; border:1px solid var(--edge); }
.cell { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font:700 13px ui-monospace, monospace; background:#262235 var(--tile-floor) center/100% 100%; user-select:none; position:relative; }
.cell.wall { background:#08070c var(--tile-wall) center/100% 100%; } .cell.rough { background:#322c3f var(--tile-rough) center/100% 100%; } .cell.half, .cell.three { background:#3a3326 var(--tile-cover) center/100% 100%; }
.cell svg.tok { width:30px; height:30px; display:block; }
.tok-sm { width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover; }
.cell.down { opacity:.5; }
.who { display:flex; gap:8px; align-items:center; }
.backdrop { width:100%; max-height:220px; object-fit:cover; border-radius:6px; margin-bottom:8px; display:block; }
.portrait { width:44px; height:44px; border-radius:6px; object-fit:cover; flex:none; } .cell.cur { outline:2px solid var(--accent); } .cell.target { cursor:crosshair; } .cell.move { cursor:pointer; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#3b1d24; border:1px solid var(--bad); padding:8px 14px; border-radius:6px; display:none; max-width:90vw; }
.start { max-width:560px; margin:30px auto; } .start label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
.start select, .start input { width:100%; }
</style>
</head>
<body>
<header><h1>CppDnD</h1><span id="sub" class="dim small"></span><span class="sp"></span>
  <button id="saveBtn" hidden>Save</button><button id="newBtn" hidden>New game</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
let gid = null, view = null, lastSeq = 0, content = null, pending = { kind: "attack", index: 0 }, busy = false;

async function api(method, path, body) {
  try {
    const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({ error: "bad response" }));
    return { status: r.status, data };
  } catch (e) { return { status: 0, data: { error: "cannot reach the server" } }; }
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500); }

// ---------------------------------------------------------------- start screen
async function showStart() {
  gid = null; view = null; lastSeq = 0;
  $("#saveBtn").hidden = $("#newBtn").hidden = true; $("#sub").textContent = "";
  if (!content) content = (await api("GET", "/api/content")).data;
  const llmInfo = (await api("GET", "/api/llm")).data;
  llmOn = !!llmInfo.enabled;
  agentsOn = !!(llmInfo.agents && llmInfo.agents.available);
  const mods = el("select", { id: "mod" }, el("option", { value: "", textContent: "Procedural delve (3 rooms)" }));
  for (const m of content.modules || []) mods.append(el("option", { value: m.id, textContent: `${m.name} (level ${m.recommendedLevel})` }));
  mods.value = (content.modules || [])[0]?.id || "";
  const role = el("select", { id: "role" }, ...[["player", "Player (one hero)"], ["dm", "Dungeon Master (all monsters)"], ["spectator", "Spectator (AI plays)"]].map(([v, t]) => el("option", { value: v, textContent: t })));
  const hero = el("select", { id: "hero" }, ...(content.characters || []).filter(c => ["thorin", "elara", "aldric", "finn"].includes(c.id)).map(c => el("option", { value: c.id, textContent: `${c.name} (${c.class})` })));
  const agentsBox = el("input", { type: "checkbox", id: "agents", disabled: !agentsOn });
  const seed = el("input", { id: "seed", type: "number", placeholder: "random" });
  const file = el("input", { type: "file", accept: ".json" });
  const go = el("button", { className: "primary", textContent: "Begin", onclick: async () => {
    const body = { module: mods.value, role: role.value, hero: hero.value };
    if (seed.value) body.seed = Number(seed.value);
    if (agentsBox.checked) body.agents = true;
    const { status, data } = await api("POST", "/api/games", body);
    if (status !== 201) return toast(data.error || "could not start");
    startGame(data.id, data.view);
  } });
  file.onchange = async () => {
    const text = await file.files[0].text(); let save; try { save = JSON.parse(text); } catch { return toast("not a valid save file"); }
    const { status, data } = await api("POST", "/api/games/load", save);
    if (status !== 201) return toast(data.error || "could not load");
    startGame(data.id, data.view);
  };
  $("#app").replaceChildren(el("div", { className: "panel start" }, el("h2", { textContent: "New game" }),
    el("label", { textContent: "Module" }), mods, el("label", { textContent: "Role" }), role, el("label", { textContent: "Hero" }), hero,
    el("label", { textContent: "AI table" }), el("label", { style: "display:flex;gap:8px;align-items:center;color:var(--text)" }, agentsBox,
      el("span", { textContent: agentsOn ? "every actor is its own model (agents.json); slower" : "not available: no agents.json found" })),
    el("label", { textContent: "Seed (optional, reproducible)" }), seed, el("div", { className: "row" }, go),
    el("label", { textContent: "Or load a save file" }), file));
}

function startGame(id, v) {
  gid = id; lastSeq = 0;
  $("#app").replaceChildren(el("main", {},
    el("div", {}, el("div", { className: "panel", id: "scene" }), el("div", { className: "panel", id: "combat", hidden: true }), el("div", { className: "panel", id: "log" }), sayBox()),
    el("div", {}, el("div", { className: "panel", id: "map" }), el("div", { className: "panel", id: "party", style: "margin-top:12px" }), el("div", { className: "panel", id: "quests", style: "margin-top:12px" }), el("div", { className: "panel", id: "table", hidden: true, style: "margin-top:12px" }), picturesPanel(), historyPanel())));
  $("#saveBtn").hidden = $("#newBtn").hidden = false;
  loadArt().then(() => { if (view) { renderScene(); renderParty(); renderCombat(); } });
  apply(v);
}


// ---------------------------------------------------------------- art: pictures when they exist, drawn tokens otherwise
let art = {};
async function loadArt() {
  const r = await api("GET", "/api/art");
  art = r.status === 200 && r.data && r.data.enabled !== false ? r.data : {};
}
function artUrl(kind, id) { const f = art[kind] && art[kind][id]; return f ? (art.base || "/art/") + f : ""; }
const ICONS = {
  fighter: "M12 3l2 2-1 8 3 1v2h-3v4h-2v-4H8v-2l3-1-1-8z",
  wizard: "M12 2l5 14H7zM5 18h14v2H5zM12 7l1 2h2l-1.6 1.2.6 2L12 11l-2 1.2.6-2L9 9h2z",
  cleric: "M10 3h4v6h6v4h-6v8h-4v-8H4V9h6z",
  rogue: "M13 3l3 3-5 9 2 2-2 4-2-2-4 1 1-4 2 1 5-9z",
  ranger: "M6 3c8 1 13 7 13 15-3-3-4-6-4-9-4 0-7 2-9 6V3zM4 20l14-14 1 1L5 21z",
  barbarian: "M5 4c5-2 10 0 12 5l3 11-3-1-2-8-4 3 1 6-3 1-1-7-3-1z",
  undead: "M12 3c5 0 8 3 8 8 0 3-1 4-2 5v3h-3v-2h-2v2h-2v-2H9v2H6v-3c-1-1-2-2-2-5 0-5 3-8 8-8zM9 9a2 2 0 100 4 2 2 0 000-4zm6 0a2 2 0 100 4 2 2 0 000-4z",
  beast: "M7 4c2 0 3 2 3 4S9 11 7 11 4 9 4 7s1-3 3-3zm10 0c2 0 3 1 3 3s-1 4-3 4-3-1-3-3 1-4 3-4zM12 12c4 0 7 4 7 7 0 2-2 2-4 1-1-.5-2-.5-3-.5s-2 0-3 .5c-2 1-4 1-4-1 0-3 3-7 7-7z",
  humanoid: "M12 3a4 4 0 110 8 4 4 0 010-8zM5 21c0-5 3-8 7-8s7 3 7 8z",
  giant: "M3 9l4 3 2-6 3 4 3-4 2 6 4-3-2 12H5z",
  other: "M12 3l9 18H3z",
};
function iconFor(a) {
  if (a.team === "party" && ICONS[a.classId]) return a.classId;
  const tags = a.tags || [];
  for (const t of ["undead", "beast", "giant", "humanoid"]) if (tags.includes(t)) return t;
  return ICONS[a.classId] ? a.classId : "other";
}
// a round token: team colour, class or creature icon, a health ring, and a pip for each condition
function tokenSvg(a) {
  const col = a.team === "party" ? "#5fb0ff" : "#e0584f", frac = a.maxHp ? Math.max(0, Math.min(1, a.hp / a.maxHp)) : 0;
  const C = 2 * Math.PI * 14, ring = frac > .5 ? "#6fcf7a" : frac > .25 ? "#e5c24a" : "#e0584f";
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 32 32"); svg.setAttribute("class", "tok");
  const pips = (a.effects || []).slice(0, 4).map((e, i) => `<circle cx="${6 + i * 7}" cy="29" r="2.4" fill="#e5c24a" stroke="#1b1726" stroke-width=".8"><title>${e}</title></circle>`).join("");
  svg.innerHTML = `<circle cx="16" cy="16" r="14" fill="#1b1726" stroke="#0c0a12" stroke-width="3"/>
    <circle cx="16" cy="16" r="14" fill="none" stroke="${ring}" stroke-width="2.4" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 16 16)"/>
    <circle cx="16" cy="16" r="11" fill="${col}" opacity=".9"/>
    <g transform="translate(8.5 8.5) scale(.625)" fill="#0b0f1a"><path d="${ICONS[iconFor(a)]}"/></g>${pips}`;
  return svg;
}
function picOrToken(kind, id, a, cls) {
  const u = artUrl(kind, id);
  if (u) return el("img", { src: u, className: cls || "portrait", alt: "", loading: "lazy" });
  return a ? tokenSvg(a) : document.createTextNode("");
}
const tile = svg => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>${svg}</svg>`)}")`;
function installTiles() {
  const r = document.documentElement.style;
  r.setProperty("--tile-floor", tile("<path d='M0 0h32v32H0z' fill='none'/><path d='M0 16h32M16 0v16M8 16v16M24 16v16' stroke='#33304a' stroke-width='1' opacity='.55'/>"));
  r.setProperty("--tile-wall", tile("<path d='M0 0h32v32H0z' fill='#14111c'/><path d='M0 8h32M0 16h32M0 24h32M8 0v8M24 0v8M16 8v8M0 8v8M32 8v8M8 16v8M24 16v8M16 24v8' stroke='#2c2740' stroke-width='1.4'/>"));
  r.setProperty("--tile-rough", tile("<g fill='#4a4260' opacity='.7'><circle cx='8' cy='9' r='2.4'/><circle cx='22' cy='7' r='1.8'/><circle cx='14' cy='20' r='2.8'/><circle cx='26' cy='24' r='2'/><circle cx='5' cy='26' r='1.6'/></g>"));
  r.setProperty("--tile-cover", tile("<rect x='5' y='9' width='22' height='15' rx='2' fill='#5a4a32' stroke='#2e2518' stroke-width='1.4'/><path d='M5 15h22M5 20h22' stroke='#2e2518' stroke-width='1'/>"));
}
installTiles();

// ---------------------------------------------------------------- plain English
let llmOn = false, agentsOn = false;
function sayBox() {
  const input = el("input", { id: "sayText", type: "text", autocomplete: "off", style: "flex:1;min-width:0",
    placeholder: llmOn ? "Say or do something, in English (e.g. go to the village and ask Marta about rumours)" : "English prompt is off: start the server with --ollama MODEL" , disabled: !llmOn });
  const btn = el("button", { className: "primary", textContent: "Send", disabled: !llmOn });
  const form = el("form", { className: "panel row", id: "say", style: "flex-wrap:nowrap;align-items:center" }, input, btn);
  form.onsubmit = async e => {
    e.preventDefault();
    const text = input.value.trim(); if (!text || busy || !gid) return;
    busy = true; btn.disabled = input.disabled = true; btn.textContent = "...";
    logLine("you", "> " + text);
    const { data } = await api("POST", `/api/games/${gid}/say?since=${lastSeq}`, { text });
    busy = false; btn.disabled = input.disabled = false; btn.textContent = "Send"; input.value = ""; input.focus();
    if (data.view) apply(data.view);
    if (data.message) logLine("narration", data.message);
    else if (data.error) toast(data.error);
  };
  return form;
}
function logLine(cls, text) { const log = $("#log"); if (!log) return; log.append(el("div", { className: cls, textContent: text })); log.scrollTop = log.scrollHeight; }

// ---------------------------------------------------------------- state
function logEvents(events) {
  const log = $("#log"); if (!log) return;
  for (const e of events) {
    if (e.seq <= lastSeq) continue; lastSeq = e.seq;
    const d = el("div", { className: e.type, textContent: e.text }); log.append(d);
    if (e.flavour) log.append(el("div", { className: "flavour", textContent: e.flavour }));
  }
  log.scrollTop = log.scrollHeight;
}
function apply(v) {
  view = v; logEvents(v.events || []);
  const cb = v.combat, cur = cb && !cb.finished ? cb.actors.find(a => a.id === cb.current) : null;
  const turn = cb ? `  |  round ${cb.round}${cur ? `, turn: ${cur.name}${cb.awaiting === cur.id ? " (waiting for you)" : ""}` : ""}` : "";
  $("#sub").textContent = `${v.module.name}  |  day ${v.clock.day}, ${String(v.clock.clockHour).padStart(2, "0")}:00${v.clock.night ? " (night)" : ""}  |  ${v.mode}${turn}`;
  renderMap(); renderScene(); renderParty(); renderQuests(); renderCombat(); refreshTable(); refreshHistory();
  if (v.mode === "combat" && v.combat && !v.combat.finished && v.combat.awaiting < 0 && !busy) setTimeout(advance, 120);
}
async function advance() {
  if (busy || !gid) return; busy = true;
  const { status, data } = await api("POST", `/api/games/${gid}/advance?since=${lastSeq}`); busy = false;
  if (status !== 200) return toast(data.error || "advance failed");
  apply(data.view);
}
async function cmd(path, body = {}) {
  if (busy || !gid) return; busy = true;
  const { data } = await api("POST", `/api/games/${gid}/${path}?since=${lastSeq}`, body); busy = false;
  if (data.ok === false && data.message) toast(data.message);
  if (data.ok === false && data.reason) toast(data.reason);
  if (data.view) apply(data.view); else if (data.error) toast(data.error);
}

// ---------------------------------------------------------------- AI table (agents)
let tableBusy = false;
async function refreshTable() {
  const box = $("#table"); if (!box) return;
  if (!view.llm || !view.llm.agents) { box.hidden = true; return; }
  if (tableBusy) return; tableBusy = true;
  const { data } = await api("GET", `/api/games/${gid}/agents`); tableBusy = false;
  if (!data.enabled) { box.hidden = true; return; }
  box.hidden = false;
  const rows = data.agents.map(a => el("div", { className: "small", style: "padding:2px 0", title: a.persona,
    textContent: `${a.name}  [${a.selector}]  ${a.model}  ${a.calls} call(s)${a.failures ? `, ${a.failures} failed` : ""}${a.modelStore && a.modelStore.exists ? "  (in store)" : ""}` }));
  const sels = [...new Set([...data.agents.map(a => a.selector), "type:undead", "type:beast", "type:humanoid", "type:giant"])];
  const sel = el("select", {}, ...sels.map(s => el("option", { value: s, textContent: s })));
  const model = el("input", { type: "text", placeholder: "model name", style: "flex:1;min-width:0" });
  const store = el("input", { type: "checkbox" });
  const go = el("button", { textContent: "Switch", onclick: async () => {
    const r = await api("POST", `/api/games/${gid}/agents/model`, { selector: sel.value, model: model.value.trim(), fromStore: store.checked });
    if (!r.data.ok) toast(r.data.error || "could not switch"); else { model.value = ""; refreshTable(); }
  } });
  const kids = [el("h2", { textContent: "AI table" }), ...rows];
  for (const p of data.problems || []) kids.push(el("div", { className: "small", style: "color:var(--bad)", textContent: p }));
  kids.push(el("div", { className: "row", style: "flex-wrap:nowrap;align-items:center;margin-top:8px" }, sel, model, el("label", { className: "small dim", title: "must exist in the model store" }, store, " store"), go));
  box.replaceChildren(...kids);
}

// ---------------------------------------------------------------- world map
const SVGNS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs = {}, text) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };
const KIND_FILL = { settlement: "#2c3a2f", wilderness: "#2b3140", site: "#3a2b2b", boundary: "#33302a" };
function renderMap() {
  const box = $("#map"), m = view.map; if (!box || !m) return;
  if (!m.nodes.length) { box.replaceChildren(el("h2", { textContent: "Map" }), el("div", { className: "dim small", textContent: "No world map for this game." })); return; }
  const nodes = m.nodes, byId = new Map(nodes.map(n => [n.id, n]));
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  for (const e of m.edges) if (byId.has(e.from) && byId.has(e.to)) { adj.get(e.from).add(e.to); adj.get(e.to).add(e.from); }
  const depth = new Map(), root = byId.has(m.start) ? m.start : nodes[0].id, q = [root]; depth.set(root, 0);
  while (q.length) { const a = q.shift(); for (const b of adj.get(a)) if (!depth.has(b)) { depth.set(b, depth.get(a) + 1); q.push(b); } }
  let extra = Math.max(...depth.values()) + 1; for (const n of nodes) if (!depth.has(n.id)) depth.set(n.id, extra);
  const layers = []; for (const n of nodes) (layers[depth.get(n.id)] ||= []).push(n);
  const NW = 140, NH = 30, GX = 30, GY = 14, pos = new Map();
  const rows = Math.max(...layers.filter(Boolean).map(l => l.length));
  const H = rows * (NH + GY) + GY, cols = layers.filter(Boolean);
  cols.forEach((layer, ci) => { layer.sort((a, b) => a.name.localeCompare(b.name));
    const top = (H - layer.length * (NH + GY) + GY) / 2;
    layer.forEach((n, ri) => pos.set(n.id, { x: GY + ci * (NW + GX), y: top + ri * (NH + GY) })); });
  const W = cols.length * (NW + GX) - GX + 2 * GY;
  const root_ = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-height:${Math.max(180, H)}px` });
  const centre = id => ({ x: pos.get(id).x + NW / 2, y: pos.get(id).y + NH / 2 });
  const drawn = new Set();
  for (const e of m.edges) {
    if (!pos.has(e.from) || !pos.has(e.to)) continue;
    const key = [e.from, e.to].sort().join("|"); if (drawn.has(key)) continue; drawn.add(key);
    const a = centre(e.from), b = centre(e.to);
    root_.append(svg("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: e.open ? "#6b6485" : "#5a3a3a", "stroke-width": 1.5, "stroke-dasharray": e.open ? "" : "4 3" }));
    const lbl = e.hours ? `${e.hours}h` : e.miles ? `${e.miles} mi` : "";
    if (lbl) root_.append(svg("text", { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 2, fill: "#9a93ab", "font-size": 8, "text-anchor": "middle", style: "paint-order:stroke;stroke:#1d1a26;stroke-width:3px" }, lbl));
  }
  const exploring = view.mode === "exploring", fighting = view.mode === "combat";
  const open = new Set(view.location ? view.location.exits.filter(x => x.available).map(x => x.to) : []);
  for (const n of nodes) {
    const p = pos.get(n.id), go = exploring && open.has(n.id);
    const g = svg("g", { style: go ? "cursor:pointer" : "" });
    g.append(svg("title", {}, `${n.name}${n.current ? " (you are here)" : n.visited ? " (visited)" : " (not yet visited)"}`));
    g.append(svg("rect", { x: p.x, y: p.y, width: NW, height: NH, rx: 6, fill: n.current ? "#c9a24d" : (KIND_FILL[n.kind] || "#2a2638"),
      stroke: n.current && fighting ? "#d65a5a" : n.current ? "#c9a24d" : go ? "#c9a24d" : "#4a4460", "stroke-width": n.current && fighting ? 3 : 1.5, "stroke-dasharray": n.visited ? "" : "3 3" }));
    g.append(svg("text", { x: p.x + NW / 2, y: p.y + (n.current ? 13 : 19), "text-anchor": "middle", "font-size": 10.5, fill: n.current ? "#1a1405" : n.visited ? "#e6e1ee" : "#9a93ab", "font-weight": n.current ? 700 : 400 }, n.name.length > 22 ? n.name.slice(0, 21) + "\u2026" : n.name));
    if (n.current) g.append(svg("text", { x: p.x + NW / 2, y: p.y + 25, "text-anchor": "middle", "font-size": 8.5, fill: fighting ? "#8a1d1d" : "#1a1405" },
      view.mode === "complete" ? "journey's end" : view.mode === "defeated" ? "fallen here" : fighting ? "fighting" : "you are here"));
    if (go) g.onclick = () => cmd("travel", { to: n.id });
    root_.append(g);
  }
  box.replaceChildren(el("h2", { textContent: "Map" }), root_,
    el("div", { className: "dim small", textContent: "Solid: visited. Dashed: known, not yet visited. Click a lit place to travel there." }));
}

// ---------------------------------------------------------------- exploration
function renderScene() {
  const box = $("#scene"), v = view, l = v.location;
  if (v.mode === "complete" || v.mode === "defeated") {
    box.replaceChildren(el("h2", { textContent: v.mode === "complete" ? "The tale is told" : "The party has fallen" }),
      el("div", { className: "row" }, el("button", { className: "primary", textContent: "New game", onclick: showStart })));
    return;
  }
  const exploring = v.mode === "exploring";
  const back = artUrl("locations", l.id) || artUrl("modules", v.module.id);
  const rows = [...(back ? [el("img", { src: back, className: "backdrop", alt: "" })] : []), el("h2", { textContent: l.name }), el("div", { textContent: l.description }),
    el("div", { className: "dim small", textContent: `Resting here: ${l.rest}` })];
  const exits = el("div", { className: "row" });
  for (const x of l.exits) {
    const hrs = x.hours || (x.miles ? `${x.miles} mi` : "");
    exits.append(el("button", { textContent: `Go: ${x.name}${hrs ? ` (${hrs}${x.hours ? "h" : ""})` : ""}`, disabled: !exploring || !x.available, title: x.blocked || x.label,
      onclick: () => cmd("travel", { to: x.to }) }));
  }
  rows.push(el("h2", { textContent: "Paths", style: "margin-top:12px" }), exits);
  for (const n of l.npcs) {
    const np = artUrl("npcs", n.id);
    const r = el("div", { className: "row" }, ...(np ? [el("img", { src: np, className: "portrait", alt: "" })] : []), el("span", { className: "dim", textContent: n.name + ` (${n.type || "commoner"}):` }));
    for (const t of n.topics) r.append(el("button", { textContent: t.id + (t.heard ? " \u2713" : ""), disabled: !exploring, onclick: () => cmd("talk", { npc: n.id, topic: t.id }) }));
    rows.push(r);
  }
  const act = el("div", { className: "row" },
    ...[["Search (1h)", () => cmd("search")], ["Short rest", () => cmd("rest", { kind: "short" })], ["Long rest", () => cmd("rest", { kind: "long" })], ["Wait 1h", () => cmd("wait", { hours: 1 })],
        ["Autopilot step", () => cmd("auto", { steps: 1 })], ["Autopilot x20", () => cmd("auto", { steps: 20 })]]
      .map(([t, f]) => el("button", { textContent: t, onclick: f, disabled: !exploring })),
    el("select", { onchange: e => cmd("pace", { pace: e.target.value }), disabled: !exploring }, ...["slow", "normal", "fast"].map(p => el("option", { value: p, textContent: "pace: " + p, selected: v.pace === p }))));
  rows.push(el("h2", { textContent: "Actions", style: "margin-top:12px" }), act);
  box.replaceChildren(...rows);
}
function renderParty() {
  const box = $("#party"); box.replaceChildren(el("h2", { textContent: "Party" }));
  const mine = view.role === "player";
  const focus = el("select", { id: "focus", title: "Which party member you control", onchange: e => e.target.value && setHero(e.target.value) },
    ...(mine ? [] : [el("option", { value: "", textContent: view.role === "dm" ? "(you are the DM)" : "(spectating)", selected: true })]),
    ...view.party.map(m => el("option", { value: m.id, textContent: `${m.name} (${m.class} ${m.level})${m.dead ? " - dead" : ""}`, disabled: m.dead, selected: mine && m.name === view.hero })));
  box.append(el("div", { className: "focus" }, el("span", { className: "dim small", textContent: "You control:" }), focus));
  for (const m of view.party) {
    const pct = Math.max(0, Math.round(100 * m.hp / m.maxHp));
    const slots = m.slots.map((n, i) => (m.slotsMax[i] ? `L${i}:${n}/${m.slotsMax[i]}` : "")).filter(Boolean).join(" ");
    const tok = picOrToken("characters", m.id, { team: "party", classId: m.class, hp: m.hp, maxHp: m.maxHp, effects: [] }, "portrait");
    box.append(el("div", { className: "member" + (m.dead ? " dead" : "") + (mine && m.name === view.hero ? " you" : ""), title: mine && m.name === view.hero ? "you control this character" : "" },
      el("div", { className: "who" }, tok.nodeType === 1 && tok.tagName.toLowerCase() === "svg" ? (tok.style.width = "34px", tok.style.height = "34px", tok) : tok, el("span", {}, el("b", { textContent: m.name }), el("span", { className: "dim small", textContent: `  ${m.class} ${m.level}  AC ${m.ac}  HP ${m.hp}/${m.maxHp}` }))),
      el("div", { className: "bar" }, el("i", { style: `width:${pct}%` })),
      el("div", { className: "dim small", textContent: `XP ${m.xp}${m.nextLevelXp ? "/" + m.nextLevelXp : ""}  potions ${m.potions}  dice ${m.hitDice}${m.exhaustion ? "  exhaustion " + m.exhaustion : ""}${slots ? "  " + slots : ""}` })));
  }
}
function renderQuests() {
  const box = $("#quests"); box.replaceChildren(el("h2", { textContent: "Quests" }));
  for (const q of view.quests) box.append(el("div", { className: "small", title: q.description, textContent: `${q.done ? "\u2611" : "\u2610"} ${q.name}`, style: q.done ? "color:var(--ok)" : "" }));
}

// ---------------------------------------------------------------- combat
function renderCombat() {
  const box = $("#combat"), c = view.combat;
  if (!c) { box.hidden = true; return; }
  box.hidden = false;
  const opts = c.options, byPos = new Map(c.actors.filter(a => a.life !== "dead").map(a => [a.pos.join(","), a]));
  const me = opts ? c.actors.find(a => a.id === opts.actor) : null;
  const w = c.grid.width;
  const grid = el("div", { id: "grid", style: `grid-template-columns:repeat(${w},32px)` });
  c.grid.rows.forEach((row, y) => [...row].forEach((ch, x) => {
    const a = byPos.get(`${x},${y}`);
    const cls = ["cell", ch === "#" ? "wall" : ch === "~" ? "rough" : ch === "c" ? "half" : ch === "O" ? "three" : ""];
    const cell = el("div", { textContent: a ? "" : ch === "." || ch === "#" || ch === "c" || ch === "O" || ch === "~" ? "" : ch });
    if (a) { const pid = a.team === "party" ? (view.party.find(p => p.name === a.name) || {}).id : a.monsterId;
      const u = artUrl(a.team === "party" ? "characters" : "monsters", pid); cell.append(u ? el("img", { src: u, className: "tok-sm", alt: "", style: "width:30px;height:30px" }) : tokenSvg(a));
      cls.push(a.team === "party" ? "party" : "foe"); if (a.life !== "alive") cls.push("down"); if (a.id === c.current) cls.push("cur"); cell.title = `${a.name}  HP ${a.hp}/${a.maxHp}  AC ${a.ac}${a.effects.length ? "  " + a.effects.join(", ") : ""}`; }
    if (opts && me) {
      if (a && a.id !== me.id && a.life !== "dead") { cls.push("target"); cell.onclick = () => useOn(a); }
      else if (!a && ch !== "#") { cls.push("move"); cell.onclick = () => doAction({ type: "move", dest: [x, y] }); }
    }
    cell.className = cls.filter(Boolean).join(" "); grid.append(cell);
  }));
  const kids = [el("h2", { textContent: `Combat  |  round ${c.round}` + (c.finished ? "  |  over" : "") }), grid];
  if (opts && me) {
    kids.push(el("div", { className: "small dim", style: "margin-top:8px", textContent: `${me.name}: move ${opts.economy.movementFt} ft  ${opts.economy.action ? "[action] " : ""}${opts.economy.bonusAction ? "[bonus] " : ""}${opts.economy.attacksLeft ? "[" + opts.economy.attacksLeft + " attack(s) left]" : ""}  click a square to move, click a creature to use the selected option` }));
    const sel = (k, i) => pending.kind === k && pending.index === i;
    const row = el("div", { className: "row" });
    for (const a of opts.attacks) row.append(el("button", { className: sel("attack", a.index) ? "sel" : "", textContent: `${a.name} ${a.toHit >= 0 ? "+" : ""}${a.toHit} ${a.damage}`, onclick: () => { pending = { kind: "attack", index: a.index }; renderCombat(); } }));
    for (const s of opts.spells) row.append(el("button", { className: sel("spell", s.id) ? "sel" : "", disabled: !s.available, textContent: s.name + (s.level ? ` (L${s.level})` : ""), onclick: () => { pending = { kind: "spell", index: s.id }; renderCombat(); } }));
    kids.push(row);
    const row2 = el("div", { className: "row" },
      el("button", { textContent: "Dash", onclick: () => doAction({ type: "dash" }) }), el("button", { textContent: "Dodge", onclick: () => doAction({ type: "dodge" }) }),
      el("button", { textContent: `Potion (${opts.potions})`, disabled: !opts.potions, onclick: () => doAction({ type: "potion", target: me.id }) }));
    for (const f of opts.features) row2.append(el("button", { textContent: `${f.id} (${f.uses})`, disabled: !f.uses, onclick: () => doAction({ type: "feature", feature: f.id }) }));
    row2.append(el("button", { className: "primary", textContent: "End turn", onclick: () => doAction({ type: "end_turn" }) }));
    kids.push(row2);
    kids.push(el("div", { className: "row" }, el("span", { className: "dim small", textContent: "Swap role:" }),
      ...["player", "dm", "spectator"].map(r => el("button", { textContent: r, onclick: () => swapRole(r) }))));
  }
  box.replaceChildren(...kids);
}
function lowestSlot(level) {
  const opts = view.combat && view.combat.options; if (!opts) return 0;
  const me = view.combat.actors.find(a => a.id === opts.actor);
  const pm = view.party.find(m => me && m.name === me.name);
  const slots = (pm && pm.slots) || opts.slots || [];
  for (let l = Math.max(level, 1); l < slots.length; l++) if (slots[l] > 0) return l;
  return 0;
}
function useOn(target) {
  if (pending.kind === "spell") {
    const sp = view.combat.options.spells.find(s => s.id === pending.index);
    doAction({ type: "cast", spell: pending.index, target: target.id, slot: sp && sp.level ? lowestSlot(sp.level) : 0 });
  }
  else doAction({ type: "attack", target: target.id, attack: pending.index });
}
async function doAction(a) {
  if (busy || !gid) return; busy = true;
  const { data } = await api("POST", `/api/games/${gid}/action?since=${lastSeq}`, a); busy = false;
  if (data.ok === false) toast(data.reason || "refused");
  if (data.view) apply(data.view); else if (data.error) toast(data.error);
}
async function setHero(id) {
  const { status, data } = await api("POST", `/api/games/${gid}/hero?since=${lastSeq}`, { hero: id });
  if (status === 200 && data.view) apply(data.view); else { toast(data.error || "cannot switch"); renderParty(); }
}


// ---------------------------------------------------------------- pictures: draw art with a local image model
let picsOpen = false, picsTimer = 0, picsDone = -1;
const subjectIds = () => {
  const ids = [];
  if (!view) return ids;
  if (view.location) { ids.push("locations/" + view.location.id); for (const n of view.location.npcs || []) ids.push("npcs/" + n.id); }
  if (view.combat) for (const a of view.combat.actors) if (a.team !== "party" && a.monsterId) ids.push("monsters/" + a.monsterId);
  return [...new Set(ids)];
};
async function drawIds(ids, force) {
  const { status, data } = await api("POST", "/api/images/generate", { ids, force });
  if (status >= 300) toast(data.error || "cannot draw"); else if (!data.queued) toast("nothing to draw: those pictures exist already");
  refreshPictures();
}
async function refreshPictures() {
  clearTimeout(picsTimer);
  const box = $("#pictures"); if (!box || !picsOpen) return;
  const { data: st } = await api("GET", "/api/images");
  if (!st.enabled) { box.replaceChildren(el("div", { className: "dim small", textContent: st.error || "Picture generation is off (see data/images.json)." })); return; }
  const j = st.jobs || {};
  if (picsDone >= 0 && j.done !== picsDone) { await loadArt(); if (view) { renderScene(); renderParty(); renderCombat(); } }
  picsDone = j.done;
  const model = el("input", { placeholder: "model (store folder or server name)", value: st.checkpoint || "", style: "flex:1" });
  model.setAttribute("list", "imgmodels");  // list is read-only as a property
  const fromStore = el("input", { type: "checkbox", id: "imgstore", checked: !!st.requireStore });
  const names = [...new Set([...(st.models.store || []), ...(st.models.server || [])])];
  const kids = [
    el("div", { className: st.reachable ? "small" : "err", textContent: `${st.describe}: ${st.reachable ? "ready" : "not reachable" + (st.error ? " (" + st.error + ")" : "")}` }),
    el("div", { className: "dim small", textContent: `model: ${st.checkpoint || "(server default)"}${st.effectiveCheckpoint && st.effectiveCheckpoint !== st.checkpoint ? " -> " + st.effectiveCheckpoint : ""}${st.store && st.store.exists ? " (in the model store)" : ""}` }),
    el("div", { className: "row" }, model, el("label", { className: "small dim" }, fromStore, " from store"),
      el("button", { textContent: "Use", onclick: async () => { const r = await api("POST", "/api/images/model", { model: model.value.trim(), fromStore: fromStore.checked }); if (r.status !== 200) toast(r.data.error || "cannot switch"); refreshPictures(); } })),
    el("datalist", { id: "imgmodels" }, ...names.map(n => el("option", { value: n }))),
    el("div", { className: "row" },
      el("button", { textContent: "Draw this scene", title: "the place, the people here and the creatures in the fight", onclick: () => drawIds(subjectIds(), false) }),
      el("button", { textContent: "Party portraits", onclick: () => drawIds(view.party.map(m => "characters/" + m.id), false) }),
      el("button", { textContent: "All missing", onclick: async () => { const r = await api("POST", "/api/images/generate", { missing: true }); if (r.status >= 300) toast(r.data.error || "cannot draw"); refreshPictures(); } }),
      el("button", { textContent: "Redo this scene", onclick: () => drawIds(subjectIds(), true) })),
  ];
  if (j.running) kids.push(el("div", { className: "small", textContent: `Drawing ${j.current || "..."}  (${j.done + j.failed} of ${j.total})` }), el("progress", { max: j.total || 1, value: j.done + j.failed }),
    el("div", { className: "row" }, el("button", { textContent: "Cancel", onclick: async () => { await api("POST", "/api/images/cancel"); refreshPictures(); } })));
  else if (j.total) kids.push(el("div", { className: "small dim", textContent: `Last run: ${j.done} drawn, ${j.failed} failed.` }));
  for (const e of (j.errors || []).slice(-3)) kids.push(el("div", { className: "err", textContent: e }));
  box.replaceChildren(...kids);
  if (j.running) picsTimer = setTimeout(refreshPictures, 1500);
}
function picturesPanel() {
  return el("details", { className: "panel pics", style: "margin-top:12px", ontoggle: e => { picsOpen = e.target.open; picsDone = -1; refreshPictures(); } },
    el("summary", { textContent: "Pictures" }), el("div", { id: "pictures" }));
}

// ---------------------------------------------------------------- history: group chat, and each actor's private record of another
let histOpen = false, histPick = { owner: "", with: "" }, histBusy = false;
async function refreshHistory() {
  const box = $("#history"); if (!box || !histOpen || histBusy) return;
  histBusy = true;
  const idx = (await api("GET", `/api/games/${gid}/history`)).data || {};
  const owners = [...new Set((idx.pairs || []).map(p => p.owner))].sort();
  if (histPick.owner && !owners.includes(histPick.owner)) histPick = { owner: "", with: "" };
  const partners = (idx.pairs || []).filter(p => p.owner === histPick.owner).map(p => p.with).sort();
  if (histPick.owner && !partners.includes(histPick.with)) histPick.with = partners[0] || "";
  let rows = [];
  if (!histPick.owner) rows = ((await api("GET", `/api/games/${gid}/history/group?limit=80`)).data.entries || []).map(e => ({ who: e.speaker, kind: e.kind, text: e.text, e }));
  else rows = ((await api("GET", `/api/games/${gid}/history/${encodeURIComponent(histPick.owner)}/${encodeURIComponent(histPick.with)}?limit=80`)).data.entries || []).map(e => ({ who: e.speaker, kind: e.kind, text: e.text, dir: e.dir, e }));
  histBusy = false;
  const pick = (owner, withWho) => { histPick = { owner, with: withWho }; refreshHistory(); };
  const ownerSel = el("select", { onchange: ev => pick(ev.target.value, "") },
    el("option", { value: "", textContent: "Group chat (everyone)", selected: !histPick.owner }), ...owners.map(o => el("option", { value: o, textContent: `${o}'s private record`, selected: o === histPick.owner })));
  const kids = [el("div", { className: "row" }, ownerSel)];
  if (histPick.owner) kids[0].append(el("span", { className: "dim small", textContent: "with" }),
    el("select", { onchange: ev => pick(histPick.owner, ev.target.value) }, ...partners.map(w => el("option", { value: w, textContent: w, selected: w === histPick.with }))));
  const list = el("div", { className: "hist" });
  for (const r of rows) {
    const mine = r.dir === "to", theirs = r.dir === "from";
    list.append(el("div", {}, el("span", { className: "meta", textContent: `d${r.e.day} ${String(r.e.hour).padStart(2, "0")}:00 ${r.kind} ` }),
      el("span", { className: theirs ? "from" : "", textContent: (mine ? "\u2192 " : theirs ? "\u2190 " : "") + r.who + ": " }), el("span", { textContent: r.text })));
  }
  if (!rows.length) list.append(el("div", { className: "dim", textContent: "Nothing yet." }));
  box.replaceChildren(el("div", {}, ...kids, list)); list.scrollTop = list.scrollHeight;
}
function historyPanel() {
  const d = el("details", { className: "panel", style: "margin-top:12px", ontoggle: e => { histOpen = e.target.open; refreshHistory(); } },
    el("summary", { textContent: "History" }), el("div", { id: "history" }));
  return d;
}
async function swapRole(r) {
  const { data } = await api("POST", `/api/games/${gid}/role?since=${lastSeq}`, { role: r });
  if (data.view) apply(data.view); else toast(data.error || "failed");
}

// ---------------------------------------------------------------- chrome
$("#saveBtn").onclick = async () => {
  const { status, data } = await api("GET", `/api/games/${gid}/save`);
  if (status !== 200) return toast("save failed");
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" })), download: `cppdnd-${gid}.json` }); a.click();
};
$("#newBtn").onclick = showStart;
showStart();
</script>
