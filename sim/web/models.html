<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CppDnD models</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; height:100%; background:#0d0b12; color:#e9e4f5; font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  #hud { position:fixed; top:10px; left:10px; width:260px; max-height:calc(100% - 20px); overflow:auto; background:rgba(20,16,30,.86); border:1px solid #3a3150; border-radius:10px; padding:10px 12px; }
  #hud h1 { font-size:15px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
  #hud label { display:block; margin:8px 0 2px; color:#a99fc4; font-size:12px; }
  #hud select, #hud button { width:100%; box-sizing:border-box; background:#2a2440; color:#e9e4f5; border:1px solid #4a4266; border-radius:6px; padding:4px 6px; font:inherit; }
  #hud button { cursor:pointer; margin-top:4px; text-align:left; } #hud button:hover { background:#3a3158; } #hud button.sel { border-color:#e5c24a; }
  #hud .row { display:flex; gap:6px; } #hud .row button { text-align:center; }
  #hud a { color:#9fc4ff; font-size:12px; } .dim { color:#a99fc4; font-size:12px; }
  #cross { position:fixed; left:50%; top:50%; width:14px; height:14px; margin:-7px; pointer-events:none; opacity:.0; }
  body.locked #cross { opacity:.8; } #cross::before, #cross::after { content:""; position:absolute; background:#fff; } #cross::before { left:6px; top:0; width:2px; height:14px; } #cross::after { top:6px; left:0; height:2px; width:14px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#2a2440; border:1px solid #e5c24a; border-radius:8px; padding:6px 12px; display:none; }
  #help { position:fixed; right:10px; bottom:10px; background:rgba(20,16,30,.75); border-radius:8px; padding:6px 10px; max-width:320px; color:#a99fc4; font-size:12px; }
  kbd { background:#2c2740; border:1px solid #4a4266; border-radius:4px; padding:0 4px; font:11px ui-monospace, monospace; color:#e9e4f5; }
  button:focus-visible, select:focus-visible { outline:3px solid #fff; outline-offset:1px; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D view. Click to look around with the mouse; W A S D to move."></canvas>
<div id="cross"></div>
<div id="hud">
  <h1>Models <a href="index.html">Back to game</a></h1>
  <label for="theme">World</label><select id="theme"></select>
  <label for="variant">Textures</label><select id="variant"></select>
  <label for="anim">Animation (everyone)</label><select id="anim"><option>Idle</option><option>Walk</option></select>
  <label>Characters</label><div id="chars"></div>
  <div id="info" class="dim" style="margin-top:8px"></div>
  <div class="row" style="margin-top:8px"><button id="reset">Reset camera</button><button id="unplace">Reset places</button></div>
  <div class="dim" style="margin-top:8px" id="note"></div>
</div>
<div id="help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move, mouse look (click the view first), <kbd>Q</kbd>/<kbd>E</kbd> down/up, <kbd>Shift</kbd> faster, wheel changes speed, <kbd>Esc</kbd> frees the mouse. Click a character to pick it, <kbd>F</kbd> to fly to it, <kbd>Shift</kbd>+click the floor to send it there. Arrow keys also turn.</div>
<div id="toast"></div>
<script type="module">
import * as THREE from "./vendor/three/three.module.min.js";
import { GLTFLoader } from "./vendor/three/jsm/loaders/GLTFLoader.js";
import { clone } from "./vendor/three/jsm/utils/SkeletonUtils.js";

const $ = s => document.querySelector(s);
const KEY = "cppdnd.models";
let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} };
saved.placed = saved.placed || {};
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500); };

// ---------------------------------------------------------------- scene
const canvas = $("#c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b12);
scene.fog = new THREE.Fog(0x0d0b12, 18, 60);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 200);
scene.add(new THREE.HemisphereLight(0xbfc8ff, 0x302820, 1.1));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2);
sun.position.set(6, 12, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 40 });
scene.add(sun);
const ROOM = 16;  // half-size of the room in metres
const aniso = renderer.capabilities.getMaxAnisotropy();
const texLoader = new THREE.TextureLoader();
const mats = { floor: new THREE.MeshStandardMaterial({ roughness: 0.9 }), wall: new THREE.MeshStandardMaterial({ roughness: 0.9 }) };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2), mats.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
for (const [x, z, ry] of [[0, -ROOM, 0], [0, ROOM, Math.PI], [-ROOM, 0, Math.PI / 2], [ROOM, 0, -Math.PI / 2]]) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, 5), mats.wall);
  w.position.set(x, 2.5, z); w.rotation.y = ry; w.receiveShadow = true; scene.add(w);
}
function setTex(surface, files) {
  const m = mats[surface], rep = surface === "floor" ? ROOM * 2 / 2 : [ROOM * 2 / 2, 2.5];
  const load = (url, srgb) => { const t = texLoader.load("assets/" + url + "?v=" + (manifest.stamp || 0)); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.repeat.set(...(Array.isArray(rep) ? rep : [rep, rep])); return t; };
  for (const k of ["map", "normalMap"]) if (m[k]) m[k].dispose();
  m.map = load(files.d, true); m.normalMap = load(files.n, false); m.needsUpdate = true;
}

// ---------------------------------------------------------------- manifest, themes, variants
let manifest = { themes: {}, characters: [] };
async function fetchManifest() {
  const r = await fetch("assets/manifest.json?t=" + Date.now()); if (!r.ok) throw new Error("no manifest");
  const m = await r.json(); m.stamp = Date.now(); return m;
}
function fillThemes() {
  const sel = $("#theme"), cur = saved.theme || "";
  sel.replaceChildren(...Object.entries(manifest.themes).map(([id, t]) => Object.assign(document.createElement("option"), { value: id, textContent: t.label })));
  sel.value = manifest.themes[cur] ? cur : Object.keys(manifest.themes)[0] || "";
}
function fillVariants(keepNew) {
  const t = manifest.themes[$("#theme").value]; if (!t) return;
  const sel = $("#variant"), vs = Object.keys(t.variants).map(Number).sort((a, b) => a - b), want = String(saved.variant && t.variants[saved.variant] ? saved.variant : vs[vs.length - 1]);
  sel.replaceChildren(...vs.map(v => Object.assign(document.createElement("option"), { value: v, textContent: `Variant ${v}` + (v === vs[vs.length - 1] && vs.length > 1 ? " (newest)" : "") })));
  sel.value = keepNew ? String(vs[vs.length - 1]) : want;
}
function applyTextures() {
  const t = manifest.themes[$("#theme").value], v = t && t.variants[$("#variant").value]; if (!v) return;
  setTex("floor", v.floor); setTex("wall", v.wall);
  saved.theme = $("#theme").value; saved.variant = +$("#variant").value; save();
}

// ---------------------------------------------------------------- characters
const loader = new GLTFLoader(), cache = new Map(), actors = new Map();
let selected = "", animName = saved.anim || "Idle";
function loadModel(c) {
  if (!cache.has(c.id)) cache.set(c.id, new Promise((res, rej) => loader.load("assets/" + c.model + "?v=" + (manifest.stamp || 0), res, undefined, rej)));
  return cache.get(c.id);
}
function play(a, name, fade = 0.25) {
  const clip = a.clips.find(k => k.name === name) || a.clips[0]; if (!clip) return;
  const next = a.mixer.clipAction(clip);
  if (a.current && a.current !== next) { next.reset().play(); a.current.crossFadeTo(next, fade, false); } else next.play();
  a.current = next; a.anim = name;
}
async function showCast() {
  for (const a of actors.values()) scene.remove(a.root);
  actors.clear(); $("#info").textContent = "";
  const theme = $("#theme").value, cast = manifest.characters.filter(c => c.module === theme);
  const list = $("#chars"); list.replaceChildren();
  let i = 0;
  for (const c of cast) {
    const idx = i++;
    const b = Object.assign(document.createElement("button"), { textContent: `${c.name} (${c.cls})`, id: "ch-" + c.id, onclick: () => select(c.id, true) });
    list.append(b);
    try {
      const g = await loadModel(c);
      const root = clone(g.scene); root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.userData.cid = c.id; } });
      const p = saved.placed[c.id] || { x: (idx - (cast.length - 1) / 2) * 2.2, z: -3, ry: 0 };
      root.position.set(p.x, 0, p.z); root.rotation.y = p.ry;
      scene.add(root);
      const a = { c, root, mixer: new THREE.AnimationMixer(root), clips: g.animations, target: null, current: null, anim: "" };
      actors.set(c.id, a); play(a, animName, 0);
    } catch (e) { b.textContent += " (model missing)"; }
  }
  if (!actors.has(selected)) selected = "";
  select(selected || (cast[0] && cast[0].id) || "", false);
}
function select(id, fly) {
  selected = id;
  for (const b of document.querySelectorAll("#chars button")) b.classList.toggle("sel", b.id === "ch-" + id);
  const a = actors.get(id); if (!a) { $("#info").textContent = ""; return; }
  const c = a.c; $("#info").textContent = `${c.name}: ${c.cls}, ${c.height} m, ${(c.tags || []).join(", ")}. Shift+click the floor to send them somewhere.`;
  if (fly) flyTo(a);
}
function flyTo(a) {
  const p = a.root.position; cam.set(p.x, 1.5, p.z + 3.2); yaw = 0; pitch = -0.12; saveCam();
}

// ---------------------------------------------------------------- camera: free fly (WASD + mouse)
const cam = new THREE.Vector3(...(saved.cam ? [saved.cam.x, saved.cam.y, saved.cam.z] : [0, 1.7, 8]));
let yaw = saved.cam ? saved.cam.yaw : 0, pitch = saved.cam ? saved.cam.pitch : -0.1, speed = saved.speed || 4;
const keys = new Set();
const saveCam = () => { saved.cam = { x: cam.x, y: cam.y, z: cam.z, yaw, pitch }; saved.speed = speed; save(); };
const locked = () => document.pointerLockElement === canvas;
addEventListener("keydown", e => {
  if (/^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "f") { const a = actors.get(selected); if (a) flyTo(a); }
  else if (k === "r") resetCam();
  else if (["w", "a", "s", "d", "q", "e", "shift", "arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) { keys.add(k); e.preventDefault(); }
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("wheel", e => { speed = Math.min(40, Math.max(0.5, speed * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); toast(`Speed ${speed.toFixed(1)} m/s`); saveCam(); }, { passive: true });
document.addEventListener("pointerlockchange", () => document.body.classList.toggle("locked", locked()));
let drag = null;
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, moved: false, btn: e.button }; canvas.focus(); });
addEventListener("pointermove", e => {
  if (locked()) { look(e.movementX, e.movementY); return; }
  if (drag && (drag.btn === 2 || drag.btn === 1 || (e.buttons & 1 && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4))) { drag.moved = true; look(e.movementX, e.movementY); }
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
addEventListener("pointerup", e => {
  const d = drag; drag = null; if (!d || e.target !== canvas || d.moved) return;
  const hit = pick(locked() ? null : e);
  if (hit && hit.cid) { select(hit.cid, false); if (!locked()) return; }
  else if (hit && e.shiftKey && selected) { sendTo(selected, hit.point); return; }
  if (!locked() && !hit) canvas.requestPointerLock?.();
});
function look(dx, dy) { yaw -= dx * 0.0022; pitch = Math.max(-1.5, Math.min(1.5, pitch - dy * 0.0022)); }
const ray = new THREE.Raycaster();
function pick(e) {
  const r = canvas.getBoundingClientRect(), v = e ? new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1) : new THREE.Vector2(0, 0);
  ray.setFromCamera(v, camera);
  const hits = ray.intersectObjects([floor, ...[...actors.values()].map(a => a.root)], true);
  const h = hits[0]; if (!h) return null;
  return h.object.userData.cid ? { cid: h.object.userData.cid, point: h.point } : h.object === floor ? { point: h.point } : null;
}
function sendTo(id, pt) {
  const a = actors.get(id); if (!a) return;
  a.target = new THREE.Vector3(Math.max(-ROOM + 1, Math.min(ROOM - 1, pt.x)), 0, Math.max(-ROOM + 1, Math.min(ROOM - 1, pt.z)));
  play(a, "Walk");
}
function resetCam() { cam.set(0, 1.7, 8); yaw = 0; pitch = -0.1; saveCam(); }

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock(); let lastSave = 0;
function frame() {
  const dt = Math.min(0.1, clock.getDelta());
  const k = x => keys.has(x), sp = speed * (k("shift") ? 3 : 1) * dt;
  if (k("arrowleft")) yaw += 1.6 * dt; if (k("arrowright")) yaw -= 1.6 * dt; if (k("arrowup")) pitch = Math.min(1.5, pitch + 1.2 * dt); if (k("arrowdown")) pitch = Math.max(-1.5, pitch - 1.2 * dt);
  const fwd = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)), right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const mv = new THREE.Vector3();
  if (k("w")) mv.add(fwd); if (k("s")) mv.sub(fwd); if (k("d")) mv.add(right); if (k("a")) mv.sub(right); if (k("e")) mv.y += 1; if (k("q")) mv.y -= 1;
  if (mv.lengthSq()) { cam.addScaledVector(mv.normalize(), sp); cam.x = Math.max(-ROOM + 0.3, Math.min(ROOM - 0.3, cam.x)); cam.z = Math.max(-ROOM + 0.3, Math.min(ROOM - 0.3, cam.z)); cam.y = Math.max(0.25, Math.min(6, cam.y)); }
  camera.position.copy(cam); camera.rotation.set(pitch, yaw, 0, "YXZ");
  for (const a of actors.values()) {
    if (a.target) {
      const d = a.target.clone().sub(a.root.position); d.y = 0; const dist = d.length();
      if (dist < 0.08) { a.target = null; play(a, animName); saved.placed[a.c.id] = { x: a.root.position.x, z: a.root.position.z, ry: a.root.rotation.y }; save(); }
      else { d.normalize(); a.root.position.addScaledVector(d, Math.min(dist, 1.6 * dt)); a.root.rotation.y = Math.atan2(d.x, d.z); }
    }
    a.mixer.update(dt);
  }
  const now = performance.now(); if (now - lastSave > 1500 && mv.lengthSq()) { saveCam(); lastSave = now; }
  const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- boot
$("#theme").onchange = () => { fillVariants(false); applyTextures(); showCast(); };
$("#variant").onchange = applyTextures;
$("#anim").onchange = e => { animName = e.target.value; saved.anim = animName; save(); for (const a of actors.values()) if (!a.target) play(a, animName); };
$("#reset").onclick = resetCam;
$("#unplace").onclick = () => { saved.placed = {}; save(); showCast(); };
(async () => {
  try { manifest = await fetchManifest(); }
  catch { $("#note").textContent = "No assets yet. Build them with assets.ps1 (needs Blender), then reload."; requestAnimationFrame(frame); return; }
  $("#anim").value = animName;
  fillThemes(); fillVariants(false); applyTextures(); await showCast();
  $("#note").textContent = "Models and their places are kept between visits. Run assets.ps1 -NewTextures to add another set of textures; they show up here by themselves.";
  requestAnimationFrame(frame);
  setInterval(async () => {   // pick up newly built textures or characters without a reload
    try {
      const m = await fetchManifest(), a = JSON.stringify({ t: m.themes, c: m.characters }), b = JSON.stringify({ t: manifest.themes, c: manifest.characters });
      if (a === b) return;
      const grew = Object.keys(m.themes).some(id => Object.keys(m.themes[id].variants).length !== Object.keys((manifest.themes[id] || { variants: {} }).variants).length);
      manifest = m; const cur = $("#theme").value; fillThemes(); $("#theme").value = manifest.themes[cur] ? cur : $("#theme").value;
      fillVariants(grew); applyTextures(); if (grew) toast("New textures are ready"); showCast();
    } catch {}
  }, 10000);
})();
</script>
</body>
</html>
